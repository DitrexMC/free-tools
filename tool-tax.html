<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消費税計算｜FreeTools</title>
  <meta name="description" content="税込・税抜の金額を自動計算する無料ツール。税率の変更にも対応。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 消費税計算</div>
    <div class="tool-hero">
      <h1>🧾 消費税計算</h1>
      <p class="subtitle" style="margin-bottom:0;">税込・税抜金額を計算します。税率は自由に変更できます。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <div class="calc-row">
        <div>
          <label>金額</label>
          <input type="number" id="amount" placeholder="1000" min="0" oninput="calc()">
        </div>
        <div>
          <label>税率 (%)</label>
          <select id="rate" onchange="calc()">
            <option value="10">10%</option>
            <option value="8">8%（軽減税率）</option>
            <option value="5">5%</option>
          </select>
        </div>
      </div>
      <div class="result" id="result">—</div>
      <p class="hint">金額欄に入力すると自動計算されます。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function calc() {
      var v = parseFloat(document.getElementById("amount").value);
      var r = parseFloat(document.getElementById("rate").value);
      var res = document.getElementById("result");
      if (!v || v < 0) { res.textContent = "—"; return; }
      var tax = v * r / 100;
      res.textContent = "税込: " + Math.round((v + tax) * 100) / 100 + " 円 ／ 消費税: " + Math.round(tax * 100) / 100 + " 円";
    }
  </script>
</body>
</html>
