<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>時給・月収計算｜FreeTools</title>
  <meta name="description" content="時給・勤務時間から日給・月収・年収を無料で計算。時給アップした場合の差額や、日数別の月収目安も一覧表示します。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 時給・月収計算</div>
    <div class="tool-hero">
      <h1>時給・月収計算</h1>
      <p class="subtitle" style="margin-bottom:0;">時給と勤務時間から給与の目安を算出。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>時給（円）</label>
      <input type="number" id="rate" value="1200" min="0" step="50" style="width:100%;box-sizing:border-box;max-width:280px;">
      <div style="margin-top:10px;">
        <label>1日あたりの勤務時間（時間）</label>
        <input type="number" id="hours" value="8" min="0" step="0.5" style="width:100%;box-sizing:border-box;max-width:280px;">
      </div>
      <div style="margin-top:10px;">
        <label>月あたりの勤務日数（日）</label>
        <input type="number" id="days" value="20" min="0" step="1" style="width:100%;box-sizing:border-box;max-width:280px;">
      </div>
      <div class="btn-row">
        <button class="primary" onclick="calc()">計算する</button>
      </div>
      <p class="hint">手取り額を出すには社会保険料や所得税を考慮する必要があります。こちらは額面の目安です。</p>
      <table class="tz-table" id="tbl" style="max-width:560px;"></table>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function yen(v) {
      return v.toLocaleString("ja-JP") + "円";
    }
    function calc() {
      var rate = parseFloat(document.getElementById("rate").value);
      var hours = parseFloat(document.getElementById("hours").value);
      var days = parseFloat(document.getElementById("days").value);
      var tbl = document.getElementById("tbl");
      if (isNaN(rate) || isNaN(hours) || isNaN(days) || rate < 0 || hours < 0 || days < 0) {
        tbl.innerHTML = "<tr><td style='color:#b71c1c;'>0以上の数値を入力してください。</td></tr>";
        return;
      }
      var day = rate * hours;
      var month = day * days;
      var year = month * 12;
      var html =
        "<tr><th>項目</th><th>額面の目安</th></tr>" +
        "<tr><td>日給</td><td style='font-weight:bold;'>" + yen(day) + "</td></tr>" +
        "<tr><td>月収（" + days + "日勤務）</td><td style='font-weight:bold;'>" + yen(month) + "</td></tr>" +
        "<tr><td>年収（12ヶ月換算）</td><td>" + yen(year) + "</td></tr>";
      tbl.innerHTML = html;
    }
    calc();
  </script>
</body>
</html>
