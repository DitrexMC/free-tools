<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曜日計算｜FreeTools</title>
  <meta name="description" content="指定した日付の曜日を計算する無料ツール。今日から何日後かの曜日も調べられます。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 曜日計算</div>
    <div class="tool-hero">
      <h1>📆 曜日計算</h1>
      <p class="subtitle" style="margin-bottom:0;">日付から曜日を計算します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>日付</label>
      <input type="date" id="date">
      <div class="btn-row">
        <button onclick="calc()">📆 曜日を調べる</button>
      </div>
      <div id="result"></div>
      <hr style="margin:20px 0;border:none;border-top:1px solid #eee;">
      <label>今日から N 日後</label>
      <div class="btn-row">
        <input type="number" id="offset" value="7" min="-1000" max="1000" style="width:100px;">
        <button onclick="offsetCalc()">➡️ 計算</button>
      </div>
      <div id="offset-result"></div>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    var DAYS = ["日", "月", "火", "水", "木", "金", "土"];
    function calc() {
      var v = document.getElementById("date").value;
      if (!v) { document.getElementById("result").innerHTML = '<p class="hint">日付を選択してください。</p>'; return; }
      var d = new Date(v + "T00:00:00");
      if (isNaN(d.getTime())) { document.getElementById("result").innerHTML = '<p class="hint">正しい日付を入力してください。</p>'; return; }
      var wd = DAYS[d.getDay()];
      var emoji = d.getDay() === 0 || d.getDay() === 6 ? "🌴" : "💼";
      document.getElementById("result").innerHTML =
        '<div style="font-size:2.2rem;font-weight:800;margin:10px 0;">' + wd + "曜日 " + emoji + "</div>" +
        "<p>" + d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日</p>";
    }
    function offsetCalc() {
      var n = parseInt(document.getElementById("offset").value);
      if (isNaN(n)) return;
      var d = new Date();
      d.setDate(d.getDate() + n);
      var wd = DAYS[d.getDay()];
      document.getElementById("offset-result").innerHTML =
        "<p>今日から" + n + "日後は <b>" + d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日（" + wd + "曜日）</b></p>";
    }
    var today = new Date();
    document.getElementById("date").value = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");
  </script>
</body>
</html>
