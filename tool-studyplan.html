<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資格試験の勉強計画計算｜FreeTools</title>
  <meta name="description" content="試験日までの勉強計画を無料で計算。残り日数・必要な総勉強時間・1日あたりの学習時間から、合格に向けたペース配分をシミュレーションします。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 資格試験の勉強計画計算</div>
    <div class="tool-hero">
      <h1>📚 資格試験の勉強計画計算</h1>
      <p class="subtitle" style="margin-bottom:0;">試験日までに必要な1日あたりの勉強時間を算出します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>試験日</label>
      <input type="date" id="examDate">
      <label>必要な総勉強時間（時間）</label>
      <input type="number" id="total" min="1" max="2000" step="1" value="300">
      <label>1日あたりの勉強時間（時間）</label>
      <input type="number" id="daily" min="0.5" max="16" step="0.5" value="2">
      <div class="btn-row">
        <button class="primary" onclick="calc()">計算する</button>
      </div>
      <table class="tz-table" id="tbl" style="max-width:640px;"></table>
      <p class="hint">※ 勉強のペースは休憩や復習の時間も考慮してください。1日あたりの時間が計算より多ければ前倒し完了、少なければペース不足の目安になります。</p>
    </div>

    <div class="card">
      <h2>📖 資格別・総勉強時間の目安</h2>
      <table class="tz-table" id="ref" style="max-width:640px;"></table>
      <p class="hint">※ 目安です。既存知識や学習スタイルにより大きく異なります。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function todayStr() {
      var d = new Date();
      return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
    }
    function calc() {
      var tbl = document.getElementById("tbl");
      var exam = document.getElementById("examDate").value;
      var total = parseFloat(document.getElementById("total").value);
      var daily = parseFloat(document.getElementById("daily").value);
      if (!exam) { tbl.innerHTML = "<tr><td>試験日を選択してください。</td></tr>"; return; }
      if (isNaN(total) || total < 1 || isNaN(daily) || daily < 0.5) { tbl.innerHTML = "<tr><td>総勉強時間と1日あたりの時間を正しく入力してください。</td></tr>"; return; }
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var examD = new Date(exam);
      examD.setHours(0, 0, 0, 0);
      var diffDays = Math.round((examD - today) / 86400000);
      var days = diffDays > 0 ? diffDays : 0;
      var needDaily = days > 0 ? total / days : Infinity;
      var finishDays = Math.ceil(total / daily);
      var finishDate = new Date(today);
      finishDate.setDate(finishDate.getDate() + finishDays);
      var finishStr = finishDate.getFullYear() + "/" + ("0" + (finishDate.getMonth() + 1)).slice(-2) + "/" + ("0" + finishDate.getDate()).slice(-2);
      var status, mark;
      if (days === 0) {
        status = "試験日が今日以前です"; mark = "🔴";
      } else if (needDaily <= daily) {
        status = "計画は余裕があります（現在のペースで間に合う）"; mark = "🟢";
      } else if (needDaily <= daily * 1.3) {
        status = "現在のペースでギリギリ間に合う可能性"; mark = "🟡";
      } else {
        status = "ペース不足です（勉強時間の増加が必要）"; mark = "🔴";
      }
      var rows = "<tr><th>項目</th><th>値</th></tr>" +
        "<tr><td>試験日までの残り日数</td><td>" + days + " 日</td></tr>" +
        "<tr><td>必要な総勉強時間</td><td>" + total + " 時間</td></tr>" +
        "<tr><td>1日あたり必要な勉強時間</td><td><b>" + (days > 0 ? needDaily.toFixed(1) : "—") + " 時間/日</b></td></tr>" +
        "<tr><td>現在のペースでの完了日</td><td>" + finishStr + "（" + finishDays + "日後）</td></tr>" +
        "<tr><td>判定</td><td>" + mark + " <b>" + status + "</b></td></tr>";
      tbl.innerHTML = rows;
    }
    function initRef() {
      var items = [
        ["ITパスポート", "100〜150時間"],
        ["基本情報技術者", "300〜500時間"],
        ["宅建士", "300〜400時間"],
        ["FP3級", "100〜150時間"],
        ["FP2級", "200〜300時間"],
        ["簿記3級", "100〜150時間"],
        ["簿記2級", "200〜300時間"],
        ["TOEIC 600点", "200〜400時間"]
      ];
      var rows = "<tr><th>資格</th><th>総勉強時間の目安</th></tr>";
      for (var i = 0; i < items.length; i++) {
        rows += "<tr><td><b>" + items[i][0] + "</b></td><td>" + items[i][1] + "</td></tr>";
      }
      document.getElementById("ref").innerHTML = rows;
    }
    (function () { document.getElementById("examDate").value = todayStr(); calc(); initRef(); })();
  </script>
</body>
</html>
