<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイマー｜FreeTools</title>
  <meta name="description" content="分・秒を指定してカウントダウンタイマーをブラウザ上で無料実行。ポモドーロテクニックや料理、作業時間の管理に便利です。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › タイマー</div>
    <div class="tool-hero">
      <h1>⏳ タイマー</h1>
      <p class="subtitle" style="margin-bottom:0;">指定時間のカウントダウンタイマーです。時間が来ると音でお知らせします。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card" style="text-align:center;">
      <h2>タイマー設定</h2>
      <div class="calc-row" style="justify-content:center;">
        <input type="number" id="min" value="5" min="0" max="999" style="width:90px;"> 分
        <input type="number" id="sec" value="0" min="0" max="59" style="width:90px;"> 秒
      </div>
      <div class="timer-display" id="display" style="font-size:3rem;font-weight:800;margin:16px 0;color:var(--primary);">05:00</div>
      <div class="btn-row" style="justify-content:center;">
        <button onclick="startTimer()">▶ スタート</button>
        <button class="secondary" onclick="pauseTimer()">⏸ 一時停止</button>
        <button class="secondary" onclick="resetTimer()">↺ リセット</button>
      </div>
      <p class="hint">タイマーが0になったら音でお知らせします。タブを閉じてもアラートは鳴りません。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    var remaining = 300, interval = null;
    var display = document.getElementById("display");
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function render() {
      var m = Math.floor(remaining / 60), s = remaining % 60;
      display.textContent = pad(m) + ":" + pad(s);
    }
    function setRemaining() {
      var m = parseInt(document.getElementById("min").value, 10) || 0;
      var s = parseInt(document.getElementById("sec").value, 10) || 0;
      if (s > 59) s = 59;
      remaining = m * 60 + s;
      if (remaining < 0) remaining = 0;
      render();
    }
    function tick() {
      remaining--;
      render();
      if (remaining <= 0) {
        clearInterval(interval);
        interval = null;
        remaining = 0;
        try { new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAABEAAAA").play(); } catch (e) {}
        alert("タイマーが終了しました！");
      }
    }
    function startTimer() {
      if (remaining <= 0) setRemaining();
      if (interval) clearInterval(interval);
      interval = setInterval(tick, 1000);
    }
    function pauseTimer() { if (interval) { clearInterval(interval); interval = null; } }
    function resetTimer() { pauseTimer(); setRemaining(); }
    document.getElementById("min").addEventListener("change", function () { pauseTimer(); setRemaining(); });
    document.getElementById("sec").addEventListener("change", function () { pauseTimer(); setRemaining(); });
    render();
  </script>
</body>
</html>
