<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>犬の散歩時間計算｜FreeTools</title>
  <meta name="description" content="愛犬の散歩時間・距離を無料で計算。犬種・月齢・天候・運動量から、適切な散歩時間の目安とカロリー消費量を求めます。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 犬の散歩時間計算</div>
    <div class="tool-hero">
      <h1>🐕 犬の散歩時間計算</h1>
      <p class="subtitle" style="margin-bottom:0;">愛犬に合った散歩時間・距離の目安を計算します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>犬の大きさ</label>
      <select id="size" onchange="calc()">
        <option value="0.7">小型犬（〜5kg チワワ・トイプードルなど）</option>
        <option value="1.0" selected>中型犬（5〜15kg 柴犬・コーギーなど）</option>
        <option value="1.3">大型犬（15kg〜 ラブラドール・ゴールデンなど）</option>
      </select>
      <label>運動量（普段の運動量の目安）</label>
      <select id="level" onchange="calc()">
        <option value="0.5">少なめ（屋内中心・おっとり）</option>
        <option value="1.0" selected>ふつう</option>
        <option value="1.5">多め（活発・狩猟犬系）</option>
      </select>
      <label>月齢（成犬の場合は24以上を選択）</label>
      <input type="number" id="age" min="2" max="240" step="1" value="24">
      <label>天候</label>
      <select id="weather" onchange="calc()">
        <option value="1.0" selected>快晴・晴れ</option>
        <option value="0.9">くもり</option>
        <option value="0.7">雨・強風</option>
        <option value="0.5">猛暑・極寒（真夏・真冬のピーク時）</option>
      </select>
      <div class="btn-row">
        <button class="primary" onclick="calc()">計算する</button>
      </div>
      <table class="tz-table" id="tbl" style="max-width:640px;"></table>
      <p class="hint">※ 月齢6ヶ月未満の子犬は体の成長のため過度な運動は避けましょう。猛暑・極寒時は短時間に変更し、早朝・夕方の涼しい時間帯を選びましょう。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function calc() {
      var tbl = document.getElementById("tbl");
      var size = parseFloat(document.getElementById("size").value);
      var level = parseFloat(document.getElementById("level").value);
      var age = parseFloat(document.getElementById("age").value);
      var weather = parseFloat(document.getElementById("weather").value);
      if (isNaN(age) || age < 2) { tbl.innerHTML = "<tr><td>月齢を2以上で入力してください。</td></tr>"; return; }
      var base = 20; // 中型犬・ふつう・晴れ の基準（分/日）
      var minutes = base * size * level * weather;
      var caution = "";
      if (age < 6) { minutes = Math.min(minutes, 15); caution = "⚠️ 月齢6ヶ月未満の子犬は1回15分までにしましょう（体の成長のため）。"; }
      if (weather <= 0.7) { caution += (caution ? " " : "") + "⚠️ 天候が悪い日は短めにして、安全を優先しましょう。"; }
      if (minutes > 120) { minutes = 120; }
      minutes = Math.round(minutes / 5) * 5;
      var dist = minutes / 60 * (size >= 1.3 ? 6.0 : size >= 1.0 ? 5.0 : 4.0); // km
      var kcal = minutes * (size >= 1.3 ? 4.5 : size >= 1.0 ? 3.0 : 2.0);
      var rows = "<tr><th>項目</th><th>値</th></tr>" +
        "<tr><td>1日あたりの目安散歩時間</td><td><b>" + minutes + " 分</b></td></tr>" +
        "<tr><td>目安の距離（速歩き換算）</td><td>約 " + dist.toFixed(1) + " km</td></tr>" +
        "<tr><td>消費カロリー目安</td><td>約 " + Math.round(kcal) + " kcal</td></tr>" +
        "<tr><td>推奨回数</td><td>" + (minutes > 60 ? "1日2回（朝・夕）に分けるのがおすすめ" : "1日1〜2回") + "</td></tr>" +
        (caution ? "<tr><td colspan='2' style='color:#c00;'>" + caution + "</td></tr>" : "");
      tbl.innerHTML = rows;
    }
    (function () { calc(); })();
  </script>
</body>
</html>
