<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>風速・気象変換｜FreeTools</title>
  <meta name="description" content="風速の単位（m/s・km/h・ノット・マイル/h）を無料で相互変換。風力階級（ビューフォート）も判定します。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 風速・気象変換</div>
    <div class="tool-hero">
      <h1>風速・気象変換</h1>
      <p class="subtitle" style="margin-bottom:0;">風速単位の変換と風力階級を判定します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>風速</label>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="number" id="val" value="10" step="0.1" style="flex:1;" oninput="convert()">
        <select id="unit" style="padding:6px;" onchange="convert()">
          <option value="ms">m/s</option>
          <option value="kmh">km/h</option>
          <option value="kt">ノット</option>
          <option value="mph">マイル/h</option>
        </select>
      </div>
      <div class="btn-row">
        <button onclick="convert()">🔄 変換する</button>
      </div>
      <table class="tz-table" id="tbl" style="max-width:400px;"></table>
      <label>風力階級（ビューフォート）</label>
      <div id="beaufort" style="padding:10px;border-radius:8px;font-weight:bold;text-align:center;"></div>
      <p class="hint">1 m/s = 3.6 km/h = 約1.944 ノット で換算します。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function toMs(v, unit) {
      switch (unit) {
        case "kmh": return v / 3.6;
        case "kt": return v * 0.514444;
        case "mph": return v * 0.44704;
        default: return v;
      }
    }
    function beaufort(mps) {
      var rows = [
        [0.3, 0, "無風", "煙がまっすぐ昇る"],
        [1.6, 1, "至軽風", "煙がなびく"],
        [3.4, 2, "軟風", "木の葉がそよぐ"],
        [5.5, 3, "和風", "旗がはためく"],
        [8.0, 4, "疾風", "砂ぼこりが立つ"],
        [10.8, 5, "雄風", "小枝が揺れる"],
        [13.9, 6, "強風", "傘がさせない"],
        [17.2, 7, "疾強風", "歩きにくい"],
        [20.8, 8, "大強風", "小枝が折れる"],
        [24.5, 9, "強風", "屋根瓦が飛ぶ"],
        [28.5, 10, "暴風", "木が倒れる"],
        [32.7, 11, "暴風", "広範囲で被害"],
        [100, 12, "颶風", "猛烈な被害"]
      ];
      for (var i = 0; i < rows.length; i++) {
        if (mps < rows[i][0]) return rows[i];
      }
      return rows[rows.length - 1];
    }
    function convert() {
      var v = parseFloat(document.getElementById("val").value);
      var unit = document.getElementById("unit").value;
      if (isNaN(v)) { document.getElementById("tbl").innerHTML = ""; return; }
      var ms = toMs(v, unit);
      var tbl = document.getElementById("tbl");
      var html = "<tr><th>単位</th><th>値</th></tr>";
      var show = function(label, val) { html += "<tr><td>" + label + "</td><td>" + val.toFixed(2) + "</td></tr>"; };
      show("m/s", ms);
      show("km/h", ms * 3.6);
      show("ノット", ms / 0.514444);
      show("マイル/h", ms / 0.44704);
      tbl.innerHTML = html;
      var bf = beaufort(ms);
      var colors = ["#9e9e9e","#81c784","#66bb6a","#4caf50","#8bc34a","#ffeb3b","#ffc107","#ff9800","#ff5722","#e64a19","#d32f2f","#b71c1c","#880e4f"];
      var el = document.getElementById("beaufort");
      el.style.background = colors[bf[1]] || "#9e9e9e";
      el.style.color = bf[1] <= 5 ? "#222" : "#fff";
      el.textContent = "風力階級 " + bf[1] + "（" + bf[2] + "）— " + bf[3];
    }
    convert();
  </script>
</body>
</html>
