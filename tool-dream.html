<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夢占い（キーワード検索）｜FreeTools</title>
  <meta name="description" content="見た夢のキーワード（水・空・歯・猫など）から夢占いの意味を無料で検索。約40種類の夢を収録し、恋愛・仕事・金運の観点から解説します。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 夢占い（キーワード検索）</div>
    <div class="tool-hero">
      <h1>夢占い（キーワード検索）</h1>
      <p class="subtitle" style="margin-bottom:0;">夢に出てきたモノや場面から意味を調べよう。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>夢のキーワード（例：水、歯、猫、空）</label>
      <input type="text" id="q" placeholder="キーワードを入力" style="width:100%;box-sizing:border-box;max-width:280px;" onkeydown="if(event.key==='Enter')search()">
      <div class="btn-row">
        <button class="primary" onclick="search()">検索する</button>
      </div>
      <p class="hint">キーワードは1つだけ入力してください。複数該当がある場合は一覧で表示されます。</p>
      <div id="chips" style="margin-bottom:10px;"></div>
      <table class="tz-table" id="tbl" style="max-width:680px;"></table>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    var DREAMS = [
      { k: "水", t: "水の夢", m: "感情や心の状態を表します。澄んだ水は心が穏やか、濁った水は悩みや不安の象徴とされます。", r: "運気変動" },
      { k: "海", t: "海の夢", m: "大きな可能性や無意識を象徴。穏やかな海は安定、荒れた海は葛藤や変化の予兆とされます。", r: "恋愛運・仕事運" },
      { k: "空", t: "空の夢", m: "希望や目標を表します。青空は好調、曇り空は迷い、夕焼けは一つの区切りを示すと言われます。", r: "願望達成" },
      { k: "空を飛ぶ", t: "空を飛ぶ夢", m: "解放感や目標達成への願望。スムーズに飛べるほど運気上昇、飛べないときはプレッシャーの表れとされます。", r: "大吉" },
      { k: "歯", t: "歯が抜ける夢", m: "不安やコンプレックスの表れとされます。家族や人間関係の変化を示唆するとも言われます。", r: "注意" },
      { k: "猫", t: "猫の夢", m: "直感や自由、神秘性の象徴。なつく猫は良い知らせ、逃げる猫はチャンスを逃す暗示とされます。", r: "直感運" },
      { k: "犬", t: "犬の夢", m: "友情や忠誠心の象徴。仲良くする夢は信頼関係の向上を表します。", r: "人間関係" },
      { k: "蛇", t: "蛇の夢", m: "生命力や変化の象徴。白い蛇は幸運、毒蛇は警戒心の表れとされます。", r: "変革・警告" },
      { k: "金", t: "お金の夢", m: "価値観や自己評価を反映。拾う夢は思わぬ収入、失う夢は不安の表れとされます。", r: "金運" },
      { k: "雨", t: "雨の夢", m: "感情の解放や浄化を表します。止む雨は悩みの解決、激しい雨はストレスの象徴とされます。", r: "浄化・回復" },
      { k: "雪", t: "雪の夢", m: "静けさや純粋さの象徴。美しい雪景色は心の平穏、大雪は感情の抑圧を示すとされます。", r: "心の安定" },
      { k: "火", t: "火の夢", m: "情熱やエネルギーを表します。暖かな火は愛情、火事は感情の暴走の警告とされます。", r: "情熱・警告" },
      { k: "死", t: "死ぬ夢", m: "終わりと再生の象徴。実際の凶事ではなく、何かが一新される前触れとされます。", r: "リセット" },
      { k: "宝くじ", t: "宝くじの夢", m: "幸運を引き寄せる期待の表れ。当たる夢は現実での努力の成果が近い暗示とされます。", r: "吉" },
      { k: "結婚", t: "結婚する夢", m: "心の統合や新しい始まりを象徴。現実の結婚願望に限らず、プロジェクトの成功も示唆します。", r: "吉" },
      { k: "赤ちゃん", t: "赤ちゃんの夢", m: "新しい可能性や純粋な心の象徴。抱っこする夢は新しい責任が近い暗示とされます。", r: "吉" },
      { k: "追われる", t: "追われる夢", m: "逃げたい悩みやプレッシャーを表します。逃げ切れる夢は問題解決の暗示とされます。", r: "警告" },
      { k: "迷子", t: "迷子になる夢", m: "進路への不安や方向性の喪失を表します。道に迷うほど迷いが大きいとされます。", r: "注意" },
      { k: "試験", t: "試験の夢", m: "評価へのプレッシャーや準備不足の不安を反映します。現実での再確認が吉とされます。", r: "注意" },
      { k: "家", t: "家の夢", m: "自分自身や心の状態を表します。広い家は可能性、狭い家は閉塞感の象徴とされます。", r: "運気変動" },
      { k: "食べ物", t: "食べる夢", m: "満足感や欲求の充足を表します。美味しく食べる夢は運気上昇の暗示とされます。", r: "吉" },
      { k: "走る", t: "走る夢", m: "目標に向かうエネルギーを表します。楽に走れると運気上昇、もつれると障害の暗示です。", r: "運気上昇" },
      { k: "落ちる", t: "落ちる夢", m: "不安定さや失敗への恐れを表します。無事に着地できる夢は回復力の証とされます。", r: "注意" },
      { k: "虫", t: "虫の夢", m: "煩わしい問題や心配事の象徴。払える虫は問題解決の暗示とされます。", r: "注意" },
      { k: "花", t: "花の夢", m: "美しさや喜び、成長の象徴。咲く花は願いの成就、枯れる花は失恋の暗示とされます。", r: "吉" },
      { k: "桜", t: "桜の夢", m: "出会いと別れの象徴。満開の桜は運気絶頂、散る桜は切なさの表れとされます。", r: "恋愛運" },
      { k: "月", t: "月の夢", m: "無意識や感情の象徴。満月は感情の高まり、三日月は新しい始まりを示すとされます。", r: "感情運" },
      { k: "太陽", t: "太陽の夢", m: "生命力や成功の象徴。明るい太陽は絶好調、雲に隠れる太陽は一時的な停滞を示します。", r: "大吉" },
      { k: "川", t: "川の夢", m: "人生の流れを表します。穏やかな川は順調、急流は変化の波に乗る暗示とされます。", r: "運気変動" },
      { k: "山", t: "山の夢", m: "目標や挑戦の象徴。登る夢は努力、頂上に立てる夢は成功の暗示とされます。", r: "挑戦運" },
      { k: "人気者", t: "人気者になる夢", m: "認められたい願望の表れ。現実で自信を持つことが吉とされます。", r: "承認欲求" },
      { k: "元カレ・元カノ", t: "元カレ・元カノの夢", m: "未練や懐かしさの表れ。心の整理がつく時期が近いとされます。", r: "心の整理" },
      { k: "血", t: "血の夢", m: "生命力やエネルギーを表します。出血は疲労の警告、血を見て怖い思いはストレスの暗示です。", r: "疲労警告" },
      { k: "数字", t: "数字の夢", m: "潜在意識のメッセージとされます。繰り返し見る数字は重要なサインとされます。", r: "メッセージ" },
      { k: "電話", t: "電話の夢", m: "コミュニケーションへの欲求を表します。受話器を取れない夢は伝えたいことが伝えられない暗示です。", r: "コミュニケーション" },
      { k: "鏡", t: "鏡の夢", m: "自己認識の象徴。きれいな鏡は自信、割れる鏡は自己イメージの変化を示すとされます。", r: "自己認識" },
      { k: "鍵", t: "鍵の夢", m: "チャンスや秘密の象徴。鍵を見つける夢は新たな可能性の発見を意味します。", r: "吉" },
      { k: "階段", t: "階段の夢", m: "人生のステップを表します。上る夢は向上、下りる夢は気力の低下を示すとされます。", r: "運気変動" },
      { k: "病院", t: "病院の夢", m: "心身のケアの必要性を表します。回復の夢は体調改善の暗示とされます。", r: "健康運" },
      { k: "学校", t: "学校の夢", m: "学びや成長の象徴。懐かしい学校の夢は初心を思い出すサインとされます。", r: "成長" }
    ];
    var CHIPS = ["水", "空", "歯", "猫", "金", "雨", "火", "恋愛"];
    (function initChips() {
      var c = document.getElementById("chips");
      CHIPS.forEach(function (k) {
        c.innerHTML += "<button class='secondary' style='margin:2px;' onclick=\"document.getElementById('q').value='" + k + "';search();\">" + k + "</button>";
      });
    })();
    function search() {
      var q = document.getElementById("q").value.trim();
      var tbl = document.getElementById("tbl");
      if (!q) { tbl.innerHTML = "<tr><td style='color:#b71c1c;'>キーワードを入力してください。</td></tr>"; return; }
      var hits = DREAMS.filter(function (d) { return d.k.indexOf(q) >= 0 || d.t.indexOf(q) >= 0; });
      if (hits.length === 0) { tbl.innerHTML = "<tr><td>「" + q + "」に一致する夢占いが見つかりませんでした。</td></tr>"; return; }
      var html = "<tr><th>夢</th><th>解説</th><th>運勢</th></tr>";
      hits.forEach(function (d) {
        html += "<tr><td style='white-space:nowrap;font-weight:bold;'>" + d.t + "</td><td>" + d.m + "</td><td>" + d.r + "</td></tr>";
      });
      tbl.innerHTML = html;
    }
  </script>
</body>
</html>
