<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UUID生成器｜FreeTools</title>
  <meta name="description" content="RFC4122準拠のUUID(v4)をブラウザ上で一括生成する無料ツール。APIキーやID採番、テストデータ作成に便利です。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › UUID生成器</div>
    <div class="tool-hero">
      <h1>🆔 UUID生成器</h1>
      <p class="subtitle" style="margin-bottom:0;">RFC4122準拠のUUID(v4)を指定個数分まとめて生成します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label for="count">生成個数</label>
      <input type="number" id="count" min="1" max="1000" value="10">
      <label style="display:inline-flex;align-items:center;gap:8px;font-weight:500;margin-top:10px;">
        <input type="checkbox" id="upper" style="width:auto;"> 大文字で出力
      </label>
      <label style="display:inline-flex;align-items:center;gap:8px;font-weight:500;">
        <input type="checkbox" id="hyphen" checked style="width:auto;"> ハイフン付き
      </label>
      <div class="btn-row">
        <button onclick="generate()">生成する</button>
        <button class="secondary" onclick="copyText('result')">すべてコピー</button>
      </div>
      <div class="result" id="result"></div>
    </div>

    <div class="card">
      <h2>UUIDとは</h2>
      <p>UUID（Universally Unique Identifier）は、世界中で重複しない識別子です。データベースの主キーやAPIのID、テストデータの作成など、さまざまな場面で利用されています。生成はブラウザの暗号化乱数（crypto.getRandomValues）を使用しています。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function uuid() {
      var b = new Uint8Array(16);
      window.crypto.getRandomValues(b);
      b[6] = (b[6] & 0x0f) | 0x40;
      b[8] = (b[8] & 0x3f) | 0x80;
      var h = Array.prototype.map.call(b, function (x) { return (x < 16 ? "0" : "") + x.toString(16); });
      return h[0]+h[1]+h[2]+h[3]+h[4]+h[5]+h[6]+h[7]+"-"+
             h[8]+h[9]+"-"+h[10]+h[11]+"-"+h[12]+h[13]+"-"+h[14]+h[15]+h[16]+h[17]+h[18]+h[19]+h[20]+h[21];
    }
    function generate() {
      var count = parseInt(document.getElementById("count").value, 10) || 10;
      if (count < 1) count = 1; if (count > 1000) count = 1000;
      var upper = document.getElementById("upper").checked;
      var hyphen = document.getElementById("hyphen").checked;
      var lines = [];
      for (var i = 0; i < count; i++) {
        var id = uuid();
        if (!hyphen) id = id.replace(/-/g, "");
        if (upper) id = id.toUpperCase();
        lines.push(id);
      }
      var result = document.getElementById("result");
      result.style.whiteSpace = "pre-wrap";
      result.textContent = lines.join("\n");
    }
    generate();
  </script>
</body>
</html>
