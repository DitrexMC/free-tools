<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新幹線・飛行機の所要時間計算｜FreeTools</title>
  <meta name="description" content="新幹線・飛行機・車で移動する際の所要時間を距離と平均速度から無料で計算。乗り換えや休憩の時間も加味して目安時間を算出します。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 新幹線・飛行機の所要時間計算</div>
    <div class="tool-hero">
      <h1>新幹線・飛行機の所要時間計算</h1>
      <p class="subtitle" style="margin-bottom:0;">移動手段ごとの所要時間を概算します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>移動距離（km）</label>
      <input type="number" id="dist" value="500" min="0" step="1" style="width:100%;box-sizing:border-box;max-width:280px;">
      <div style="margin-top:10px;">
        <label>交通手段（平均速度の目安）</label>
        <table class="tz-table" id="tbl" style="max-width:560px;"></table>
      </div>
      <p class="hint">新幹線は約240km/h・在来線特急は約100km/h・飛行機は約800km/h・自家用車（高速）は約80km/hを目安にしています。実際の所要時間は停車駅・乗り換え・待ち時間・渋滞などで大きく変わります。あくまで概算としてお使いください。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    var MODES = [
      { n: "新幹線（のぞみ）", v: 240 },
      { n: "在来線特急", v: 100 },
      { n: "飛行機", v: 800 },
      { n: "自家用車（高速道路）", v: 80 },
      { n: "自家用車（一般道）", v: 40 },
      { n: "徒歩", v: 4 }
    ];
    function fmtH(d) {
      var h = Math.floor(d);
      var m = Math.round((d - h) * 60);
      if (m >= 60) { h += 1; m -= 60; }
      return h + "時間" + (m > 0 ? m + "分" : "");
    }
    function calc() {
      var dist = parseFloat(document.getElementById("dist").value);
      var tbl = document.getElementById("tbl");
      if (isNaN(dist) || dist < 0) {
        tbl.innerHTML = "<tr><td style='color:#b71c1c;'>0以上の距離を入力してください。</td></tr>";
        return;
      }
      var html = "<tr><th>交通手段</th><th>概算所要時間</th></tr>";
      for (var i = 0; i < MODES.length; i++) {
        var hours = dist / MODES[i].v;
        var note = "";
        if (hours >= 6) note = "（長時間の移動。休憩を入れましょう）";
        else if (MODES[i].v >= 240 && hours < 0.5) note = "（短距離なら電車の方が便利かも）";
        html += "<tr><td>" + MODES[i].n + "</td><td style='font-weight:bold;'>" + fmtH(hours) + note + "</td></tr>";
      }
      tbl.innerHTML = html;
    }
    calc();
  </script>
</body>
</html>
