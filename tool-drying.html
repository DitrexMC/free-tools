<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>洗濯物が乾く時間計算｜FreeTools</title>
  <meta name="description" content="天気・気温・湿度・風から洗濯物が乾く時間の目安を無料で計算。室内干し・部屋干しのコツも表示します。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 洗濯物が乾く時間計算</div>
    <div class="tool-hero">
      <h1>洗濯物が乾く時間計算</h1>
      <p class="subtitle" style="margin-bottom:0;">気象条件から乾き時間を目安算出。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>天気</label>
      <select id="weather" style="width:100%;box-sizing:border-box;max-width:260px;">
        <option value="晴れ" selected>晴れ</option>
        <option value="くもり">くもり</option>
        <option value="雨">雨・雪</option>
      </select>
      <div style="margin-top:10px;">
        <label>気温（℃）</label>
        <input type="number" id="temp" min="-10" max="45" value="25">
      </div>
      <div style="margin-top:10px;">
        <label>湿度（％）</label>
        <input type="number" id="humidity" min="0" max="100" value="50">
      </div>
      <div style="margin-top:10px;">
        <label>風の強さ</label>
        <select id="wind" style="width:100%;box-sizing:border-box;max-width:260px;">
          <option value="弱い">弱い（無風）</option>
          <option value="普通" selected>普通</option>
          <option value="強い">強い（風通しが良い）</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="primary" onclick="calc()">乾く時間を計算</button>
      </div>
      <table class="tz-table" id="tbl" style="max-width:560px;"></table>
      <p class="hint">※ 一般的なTシャツ・タオルを屋外干しした場合の目安です。素材や厚さで変わります。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function calc() {
      var weather = document.getElementById("weather").value;
      var temp = parseFloat(document.getElementById("temp").value);
      var humidity = parseFloat(document.getElementById("humidity").value);
      var wind = document.getElementById("wind").value;
      var tbl = document.getElementById("tbl");
      if (isNaN(temp) || isNaN(humidity) || humidity < 0 || humidity > 100) {
        tbl.innerHTML = "<tr><td>気温・湿度を正しく入力してください。</td></tr>"; return;
      }
      // 基準：晴れ・25℃・50%・普通の風 → 約2時間
      var hours = 2.0;
      if (weather === "くもり") hours *= 1.5;
      if (weather === "雨") hours *= 2.5;
      hours *= (temp >= 20 ? 1.0 : temp >= 10 ? 1.3 : 1.7);
      hours *= (humidity <= 40 ? 0.8 : humidity <= 60 ? 1.0 : humidity <= 80 ? 1.4 : 1.8);
      hours *= (wind === "強い" ? 0.7 : wind === "弱い" ? 1.3 : 1.0);
      var h = Math.floor(hours);
      var m = Math.round((hours - h) * 60);
      var timeStr = h > 0 ? h + "時間" + (m > 0 ? m + "分" : "") : (m > 0 ? m + "分" : "1時間未満");
      var advice = hours > 3.5 ? "乾きにくい条件です。部屋干し＋除湿機や風通しを工夫しましょう。" :
        hours > 2.5 ? "少し時間がかかりそうです。風通しを良くしましょう。" :
        "乾きやすい条件です。外干しがおすすめです。";
      var rows = "<tr><th>項目</th><th>値</th></tr>" +
        "<tr><td>天気</td><td>" + weather + "</td></tr>" +
        "<tr><td>乾く時間の目安</td><td>約 " + timeStr + "</td></tr>" +
        "<tr><td colspan='2' style='background:#f5f5f5;'>" + advice + "</td></tr>";
      tbl.innerHTML = rows;
    }
    calc();
  </script>
</body>
</html>
