<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>畳数・部屋の広さ計算｜FreeTools</title>
  <meta name="description" content="部屋の広さ（㎡）と畳数を無料で相互換算。京間・江戸間・団地間など地域・規格別の畳サイズに対応し、坪数も同時に表示します。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 畳数・部屋の広さ計算</div>
    <div class="tool-hero">
      <h1>🏠 畳数・部屋の広さ計算</h1>
      <p class="subtitle" style="margin-bottom:0;">㎡ ⇔ 畳数の相互換算と坪数を表示します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>畳の規格（1畳の大きさ）</label>
      <select id="type" onchange="calc()">
        <option value="1.6562">京間（1.82m×0.91m = 1.6562㎡）※関西</option>
        <option value="1.62">中京間（1.80m×0.90m = 1.62㎡）※中部</option>
        <option value="1.5488">江戸間（1.76m×0.88m = 1.5488㎡）※関東</option>
        <option value="1.445">団地間（1.70m×0.85m = 1.445㎡）※団地</option>
        <option value="1.62" selected>標準（1.62㎡）</option>
      </select>
      <div style="display:flex;gap:16px;flex-wrap:wrap;">
        <div style="flex:1;min-width:200px;">
          <label>部屋の広さ（㎡）</label>
          <input type="number" id="sqm" min="0" max="10000" step="0.1" value="16.2">
        </div>
        <div style="flex:1;min-width:200px;">
          <label>畳数</label>
          <input type="number" id="tatami" min="0" max="1000" step="0.5" value="10">
        </div>
      </div>
      <div class="btn-row">
        <button class="primary" onclick="calc()">計算する</button>
      </div>
      <table class="tz-table" id="tbl" style="max-width:640px;"></table>
      <p class="hint">※ 上段に㎡を入力すると畳数へ、下段に畳数を入力すると㎡へ換算します。両方入力した場合は㎡を優先します。1坪 = 3.30579㎡、1畳はおおよそ1.62㎡（地域で異なる）とされます。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function calc() {
      var tbl = document.getElementById("tbl");
      var size = parseFloat(document.getElementById("type").value);
      var sqm = parseFloat(document.getElementById("sqm").value);
      var tatami = parseFloat(document.getElementById("tatami").value);
      if (!isNaN(sqm) && sqm > 0) {
        var t = sqm / size;
        var p = sqm / 3.30579;
        var rows = "<tr><th>項目</th><th>値</th></tr>" +
          "<tr><td>部屋の広さ</td><td><b>" + sqm.toFixed(1) + " ㎡</b></td></tr>" +
          "<tr><td>畳数（換算）</td><td>約 " + t.toFixed(1) + " 畳</td></tr>" +
          "<tr><td>坪数</td><td>約 " + p.toFixed(2) + " 坪</td></tr>" +
          "<tr><td>1畳の大きさ（選択規格）</td><td>" + size.toFixed(4) + " ㎡</td></tr>";
        tbl.innerHTML = rows;
      } else if (!isNaN(tatami) && tatami > 0) {
        var sq = tatami * size;
        var p2 = sq / 3.30579;
        var rows2 = "<tr><th>項目</th><th>値</th></tr>" +
          "<tr><td>畳数</td><td><b>" + tatami + " 畳</b></td></tr>" +
          "<tr><td>部屋の広さ（換算）</td><td>約 " + sq.toFixed(1) + " ㎡</td></tr>" +
          "<tr><td>坪数</td><td>約 " + p2.toFixed(2) + " 坪</td></tr>" +
          "<tr><td>1畳の大きさ（選択規格）</td><td>" + size.toFixed(4) + " ㎡</td></tr>";
        tbl.innerHTML = rows2;
      } else {
        tbl.innerHTML = "<tr><td>㎡または畳数を正しく入力してください。</td></tr>";
      }
    }
    (function () { calc(); })();
  </script>
</body>
</html>
