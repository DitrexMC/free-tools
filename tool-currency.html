<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>為替レート変換｜FreeTools</title>
  <meta name="description" content="主要通貨間のおおよその為替換算ができる無料ツール。海外旅行の目安に。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 為替レート変換</div>
    <div class="tool-hero">
      <h1>💱 為替レート変換</h1>
      <p class="subtitle" style="margin-bottom:0;">主要通貨のおおよその換算ができます（参考レート）。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <div class="calc-row">
        <div>
          <label>金額</label>
          <input type="number" id="amount" placeholder="1000" min="0" oninput="convert()">
        </div>
        <div>
          <label>通貨（変換元）</label>
          <select id="from" onchange="convert()"></select>
        </div>
        <div>
          <label>通貨（変換先）</label>
          <select id="to" onchange="convert()"></select>
        </div>
      </div>
      <div class="result" id="result">—</div>
      <p class="hint">※ レートは目安です。実際の取引には各金融機関のレートをご利用ください。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    // 1 JPY に対する参考レート（2026年時点の目安）
    var RATES = {
      JPY: 1,
      USD: 0.0068,
      EUR: 0.0062,
      GBP: 0.0053,
      CNY: 0.049,
      KRW: 9.3,
      AUD: 0.0103,
      CAD: 0.0093,
      THB: 0.24,
      SGD: 0.0091
    };
    function init() {
      var from = document.getElementById("from");
      var to = document.getElementById("to");
      Object.keys(RATES).forEach(function (code) {
        from.add(new Option(code, code));
        to.add(new Option(code, code));
      });
      to.value = "USD";
    }
    function convert() {
      var v = parseFloat(document.getElementById("amount").value);
      var f = document.getElementById("from").value;
      var t = document.getElementById("to").value;
      var res = document.getElementById("result");
      if (!v || v < 0) { res.textContent = "—"; return; }
      var result = v / RATES[f] * RATES[t];
      var decimals = RATES[t] < 0.05 ? 2 : (RATES[t] < 1 ? 2 : 0);
      res.textContent = v.toLocaleString("ja-JP") + " " + f + " = " + result.toLocaleString("ja-JP", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + " " + t;
    }
    document.addEventListener("DOMContentLoaded", function () {
      init();
      convert();
    });
  </script>
</body>
</html>
