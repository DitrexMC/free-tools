<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード生成器｜FreeTools</title>
  <meta name="description" content="大文字・小文字・数字・記号を含む安全なランダムパスワードを無料で生成。長さや使用文字種を自由にカスタマイズできます。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › パスワード生成器</div>
    <div class="tool-hero">
      <h1>🔑 パスワード生成器</h1>
      <p class="subtitle" style="margin-bottom:0;">安全なランダムパスワードを生成。全生成処理はブラウザ内で完結します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label for="length">パスワードの長さ</label>
      <input type="number" id="length" min="4" max="128" value="16">
      <div style="margin-top:10px;">
        <label style="display:inline-flex;align-items:center;gap:8px;font-weight:500;">
          <input type="checkbox" id="useUpper" checked style="width:auto;"> 大文字 (A-Z)
        </label>
      </div>
      <div>
        <label style="display:inline-flex;align-items:center;gap:8px;font-weight:500;">
          <input type="checkbox" id="useLower" checked style="width:auto;"> 小文字 (a-z)
        </label>
      </div>
      <div>
        <label style="display:inline-flex;align-items:center;gap:8px;font-weight:500;">
          <input type="checkbox" id="useNumber" checked style="width:auto;"> 数字 (0-9)
        </label>
      </div>
      <div>
        <label style="display:inline-flex;align-items:center;gap:8px;font-weight:500;">
          <input type="checkbox" id="useSymbol" checked style="width:auto;"> 記号 (!@#$%…)
        </label>
      </div>
      <label for="count" style="margin-top:14px;">生成個数</label>
      <input type="number" id="count" min="1" max="100" value="5">
      <div class="btn-row">
        <button onclick="generate()">生成する</button>
      </div>
      <div class="result" id="result"></div>
      <div class="btn-row">
        <button class="secondary" onclick="copyAll()">すべてコピー</button>
      </div>
    </div>

    <div class="card">
      <h2>安全なパスワードのポイント</h2>
      <p>12文字以上・英数字と記号の組み合わせ・使い回しをしないことが重要です。このツールの生成はすべてお使いのブラウザ内で行われるため、パスワードがネットワークに送信されることはありません。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function randInt(max) { return Math.floor(Math.random() * max); }
    function generate() {
      var len = parseInt(document.getElementById("length").value, 10) || 16;
      var count = parseInt(document.getElementById("count").value, 10) || 5;
      if (len < 4) len = 4; if (len > 128) len = 128;
      if (count < 1) count = 1; if (count > 100) count = 100;
      var pool = "";
      if (document.getElementById("useUpper").checked) pool += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      if (document.getElementById("useLower").checked) pool += "abcdefghijklmnopqrstuvwxyz";
      if (document.getElementById("useNumber").checked) pool += "0123456789";
      if (document.getElementById("useSymbol").checked) pool += "!@#$%^&*()_+-=[]{}|;:,.<>?";
      if (!pool) { alert("使用する文字種を1つ以上選択してください。"); return; }
      var lines = [];
      for (var n = 0; n < count; n++) {
        var arr = new Uint32Array(len);
        window.crypto.getRandomValues(arr);
        var pwd = "";
        for (var i = 0; i < len; i++) pwd += pool[arr[i] % pool.length];
        lines.push(pwd);
      }
      var result = document.getElementById("result");
      result.style.whiteSpace = "pre-wrap";
      result.textContent = lines.join("\n");
    }
    function copyAll() {
      var result = document.getElementById("result");
      var text = result.textContent;
      if (!text) return;
      if (navigator.clipboard) { navigator.clipboard.writeText(text).then(function(){ alert("コピーしました"); }); }
    }
    generate();
  </script>
</body>
</html>
