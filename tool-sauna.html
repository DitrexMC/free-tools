<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サウナサイクルタイマー｜FreeTools</title>
  <meta name="description" content="サウナ・水風呂・外気浴のサイクルを無料で計画。現在時刻から各セットの開始・終了時刻をタイムテーブル表示します。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › サウナサイクルタイマー</div>
    <div class="tool-hero">
      <h1>サウナサイクルタイマー</h1>
      <p class="subtitle" style="margin-bottom:0;">サウナ→水風呂→外気浴の1セットを計画。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>開始時刻</label>
      <input type="time" id="start" value="20:00" style="width:100%;box-sizing:border-box;max-width:200px;">
      <div style="margin-top:10px;">
        <label>サウナ（分）</label>
        <input type="number" id="sauna" value="10" min="1" step="1" style="width:100px;">
      </div>
      <div style="margin-top:10px;">
        <label>水風呂（分）</label>
        <input type="number" id="cold" value="1" min="0.5" step="0.5" style="width:100px;">
      </div>
      <div style="margin-top:10px;">
        <label>外気浴（分）</label>
        <input type="number" id="rest" value="8" min="1" step="1" style="width:100px;">
      </div>
      <div style="margin-top:10px;">
        <label>セット数</label>
        <select id="sets" style="width:100%;box-sizing:border-box;max-width:200px;">
          <option value="1">1セット</option>
          <option value="2">2セット</option>
          <option value="3" selected>3セット</option>
          <option value="4">4セット</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="primary" onclick="calc()">タイムテーブルを作成</button>
      </div>
      <p class="hint">体調に合わせて無理のない範囲で行いましょう。水風呂は無理に長く入らないのがコツです。</p>
      <table class="tz-table" id="tbl" style="max-width:560px;"></table>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function fmt2(n) { return String(Math.floor(n)).padStart(2, "0"); }
    function fmtClock(min) {
      var d = Math.floor(min / 1440);
      min = ((min % 1440) + 1440) % 1440;
      var h = Math.floor(min / 60);
      var m = Math.floor(min % 60);
      return fmt2(h) + ":" + fmt2(m) + (d > 0 ? "（翌日）" : "");
    }
    function calc() {
      var st = document.getElementById("start").value;
      var sa = parseFloat(document.getElementById("sauna").value);
      var co = parseFloat(document.getElementById("cold").value);
      var re = parseFloat(document.getElementById("rest").value);
      var sets = parseInt(document.getElementById("sets").value, 10);
      var tbl = document.getElementById("tbl");
      if (!st || isNaN(sa) || isNaN(co) || isNaN(re) || sa <= 0 || co <= 0 || re <= 0) {
        tbl.innerHTML = "<tr><td style='color:#b71c1c;'>正しい値を入力してください。</td></tr>";
        return;
      }
      var hh = parseInt(st.split(":")[0], 10);
      var mm = parseInt(st.split(":")[1], 10);
      var cur = hh * 60 + mm;
      var rows = "<tr><th>セット</th><th>サウナ</th><th>水風呂</th><th>外気浴</th></tr>";
      for (var i = 0; i < sets; i++) {
        var t1 = cur;
        var t2 = t1 + sa;
        var t3 = t2 + co;
        var t4 = t3 + re;
        rows += "<tr><td>" + (i + 1) + "セット目</td>" +
          "<td>" + fmtClock(t1) + "〜" + fmtClock(t2) + "</td>" +
          "<td>" + fmtClock(t2) + "〜" + fmtClock(t3) + "</td>" +
          "<td>" + fmtClock(t3) + "〜" + fmtClock(t4) + "</td></tr>";
        cur = t4;
      }
      rows += "<tr><td colspan='4' style='background:#f5f5f5;'>合計 " + fmtClock(cur - (hh * 60 + mm)) + "（約）／1セットあたり " + (sa + co + re) + " 分</td></tr>";
      tbl.innerHTML = rows;
    }
    calc();
  </script>
</body>
</html>
