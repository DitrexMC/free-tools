<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハッシュ比較・照合｜FreeTools</title>
  <meta name="description" content="テキストのハッシュ値を計算し、比較・照合する無料ツール。SHA-256・MD5・SHA-1に対応。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › ハッシュ比較・照合</div>
    <div class="tool-hero">
      <h1>ハッシュ比較・照合</h1>
      <p class="subtitle" style="margin-bottom:0;">入力テキストのハッシュを計算し、既知のハッシュ値と照合できます。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>テキストを入力</label>
      <textarea id="input" rows="4" style="width:100%;" placeholder="パスワードや文字列を入力…"></textarea>
      <div class="btn-row">
        <button onclick="hashAll()">🔍 ハッシュを計算</button>
      </div>
      <div id="hashTable"></div>
    </div>

    <div class="card">
      <label>照合（比較するハッシュ値）</label>
      <input type="text" id="expected" placeholder="例: 5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8" style="width:100%;">
      <div class="btn-row">
        <button onclick="compare()">⚖️ 照合する</button>
      </div>
      <div id="cmpResult"></div>
      <p class="hint">MD5（32桁）・SHA-1（40桁）・SHA-256（64桁）のどれでも自動判定して照合できます。ハッシュは端末内でのみ計算され、送信されません。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    var current = {};
    function toHex(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
    }
    // Pure-JS MD5 (Web Crypto doesn't support MD5) — blueimp implementation (MIT)
    function md5(string) {
      function safeAdd(x, y) {
        var lsw = (x & 0xFFFF) + (y & 0xFFFF);
        var msw = (x >> 16) + (y >> 16) + (lsw >> 16);
        return (msw << 16) | (lsw & 0xFFFF);
      }
      function bitRotateLeft(num, cnt) { return (num << cnt) | (num >>> (32 - cnt)); }
      function md5cmn(q, a, b, x, s, t) {
        return safeAdd(bitRotateLeft(safeAdd(safeAdd(a, q), safeAdd(x, t)), s), b);
      }
      function md5ff(a, b, c, d, x, s, t) { return md5cmn((b & c) | (~b & d), a, b, x, s, t); }
      function md5gg(a, b, c, d, x, s, t) { return md5cmn((b & d) | (c & ~d), a, b, x, s, t); }
      function md5hh(a, b, c, d, x, s, t) { return md5cmn(b ^ c ^ d, a, b, x, s, t); }
      function md5ii(a, b, c, d, x, s, t) { return md5cmn(c ^ (b | ~d), a, b, x, s, t); }
      function binlMD5(x, len) {
        x[len >> 5] |= 0x80 << len % 32;
        x[(((len + 64) >>> 9) << 4) + 14] = len;
        var i, olda, oldb, oldc, oldd;
        var a = 1732584193, b = -271733879, c = -1732584194, d = 271733878;
        for (i = 0; i < x.length; i += 16) {
          olda = a; oldb = b; oldc = c; oldd = d;
          a = md5ff(a, b, c, d, x[i], 7, -680876936); d = md5ff(d, a, b, c, x[i + 1], 12, -389564586);
          c = md5ff(c, d, a, b, x[i + 2], 17, 606105819); b = md5ff(b, c, d, a, x[i + 3], 22, -1044525330);
          a = md5ff(a, b, c, d, x[i + 4], 7, -176418897); d = md5ff(d, a, b, c, x[i + 5], 12, 1200080426);
          c = md5ff(c, d, a, b, x[i + 6], 17, -1473231341); b = md5ff(b, c, d, a, x[i + 7], 22, -45705983);
          a = md5ff(a, b, c, d, x[i + 8], 7, 1770035416); d = md5ff(d, a, b, c, x[i + 9], 12, -1958414417);
          c = md5ff(c, d, a, b, x[i + 10], 17, -42063); b = md5ff(b, c, d, a, x[i + 11], 22, -1990404162);
          a = md5ff(a, b, c, d, x[i + 12], 7, 1804603682); d = md5ff(d, a, b, c, x[i + 13], 12, -40341101);
          c = md5ff(c, d, a, b, x[i + 14], 17, -1502002290); b = md5ff(b, c, d, a, x[i + 15], 22, 1236535329);
          a = md5gg(a, b, c, d, x[i + 1], 5, -165796510); d = md5gg(d, a, b, c, x[i + 6], 9, -1069501632);
          c = md5gg(c, d, a, b, x[i + 11], 14, 643717713); b = md5gg(b, c, d, a, x[i], 20, -373897302);
          a = md5gg(a, b, c, d, x[i + 5], 5, -701558691); d = md5gg(d, a, b, c, x[i + 10], 9, 38016083);
          c = md5gg(c, d, a, b, x[i + 15], 14, -660478335); b = md5gg(b, c, d, a, x[i + 4], 20, -405537848);
          a = md5gg(a, b, c, d, x[i + 9], 5, 568446438); d = md5gg(d, a, b, c, x[i + 14], 9, -1019803690);
          c = md5gg(c, d, a, b, x[i + 3], 14, -187363961); b = md5gg(b, c, d, a, x[i + 8], 20, 1163531501);
          a = md5gg(a, b, c, d, x[i + 13], 5, -1444681467); d = md5gg(d, a, b, c, x[i + 2], 9, -51403784);
          c = md5gg(c, d, a, b, x[i + 7], 14, 1735328473); b = md5gg(b, c, d, a, x[i + 12], 20, -1926607734);
          a = md5hh(a, b, c, d, x[i + 5], 4, -378558); d = md5hh(d, a, b, c, x[i + 8], 11, -2022574463);
          c = md5hh(c, d, a, b, x[i + 11], 16, 1839030562); b = md5hh(b, c, d, a, x[i + 14], 23, -35309556);
          a = md5hh(a, b, c, d, x[i + 1], 4, -1530992060); d = md5hh(d, a, b, c, x[i + 4], 11, 1272893353);
          c = md5hh(c, d, a, b, x[i + 7], 16, -155497632); b = md5hh(b, c, d, a, x[i + 10], 23, -1094730640);
          a = md5hh(a, b, c, d, x[i + 13], 4, 681279174); d = md5hh(d, a, b, c, x[i], 11, -358537222);
          c = md5hh(c, d, a, b, x[i + 3], 16, -722521979); b = md5hh(b, c, d, a, x[i + 6], 23, 76029189);
          a = md5hh(a, b, c, d, x[i + 9], 4, -640364487); d = md5hh(d, a, b, c, x[i + 12], 11, -421815835);
          c = md5hh(c, d, a, b, x[i + 15], 16, 530742520); b = md5hh(b, c, d, a, x[i + 2], 23, -995338651);
          a = md5ii(a, b, c, d, x[i], 6, -198630844); d = md5ii(d, a, b, c, x[i + 7], 10, 1126891415);
          c = md5ii(c, d, a, b, x[i + 14], 15, -1416354905); b = md5ii(b, c, d, a, x[i + 5], 21, -57434055);
          a = md5ii(a, b, c, d, x[i + 12], 6, 1700485571); d = md5ii(d, a, b, c, x[i + 3], 10, -1894986606);
          c = md5ii(c, d, a, b, x[i + 10], 15, -1051523); b = md5ii(b, c, d, a, x[i + 1], 21, -2054922799);
          a = md5ii(a, b, c, d, x[i + 8], 6, 1873313359); d = md5ii(d, a, b, c, x[i + 15], 10, -30611744);
          c = md5ii(c, d, a, b, x[i + 6], 15, -1560198380); b = md5ii(b, c, d, a, x[i + 13], 21, 1309151649);
          a = md5ii(a, b, c, d, x[i + 4], 6, -145523070); d = md5ii(d, a, b, c, x[i + 11], 10, -1120210379);
          c = md5ii(c, d, a, b, x[i + 2], 15, 718787259); b = md5ii(b, c, d, a, x[i + 9], 21, -343485551);
          a = safeAdd(a, olda); b = safeAdd(b, oldb); c = safeAdd(c, oldc); d = safeAdd(d, oldd);
        }
        return [a, b, c, d];
      }
      function binl2rstr(input) {
        var i, output = "", length32 = input.length * 32;
        for (i = 0; i < length32; i += 8) {
          output += String.fromCharCode((input[i >> 5] >>> i % 32) & 0xFF);
        }
        return output;
      }
      function rstr2binl(input) {
        var i, output = [];
        output[(input.length >> 2) - 1] = undefined;
        for (i = 0; i < output.length; i += 1) { output[i] = 0; }
        var length8 = input.length * 8;
        for (i = 0; i < length8; i += 8) {
          output[i >> 5] |= (input.charCodeAt(i / 8) & 0xFF) << i % 32;
        }
        return output;
      }
      function rstrMD5(s) { return binl2rstr(binlMD5(rstr2binl(s), s.length * 8)); }
      function rstr2hex(input) {
        var hexTab = "0123456789abcdef", output = "", x, i;
        for (i = 0; i < input.length; i += 1) {
          x = input.charCodeAt(i);
          output += hexTab.charAt((x >>> 4) & 0x0F) + hexTab.charAt(x & 0x0F);
        }
        return output;
      }
      function str2rstrUTF8(input) { return unescape(encodeURIComponent(input)); }
      return rstr2hex(rstrMD5(str2rstrUTF8(string)));
    }
    function hashAll() {
      var text = document.getElementById("input").value;
      var res = document.getElementById("hashTable");
      if (!text) { res.innerHTML = '<p class="hint">テキストを入力してください。</p>'; return; }
      var enc = new TextEncoder().encode(text);
      var names = [["SHA-256", "sha-256"], ["SHA-1", "sha-1"], ["MD5", "md5"]];
      var html = "<table class='tz-table'><tr><th>アルゴリズム</th><th>ハッシュ値</th></tr>";
      // MD5 via pure JS
      var md5hex = md5(text);
      current["md5"] = md5hex;
      html += "<tr><td><b>MD5</b></td><td style='font-family:monospace;font-size:0.85rem;word-break:break-all;'>" + md5hex + "</td></tr>";
      var promises = names.filter(function (n) { return n[1] !== "md5"; }).map(function (n) {
        return crypto.subtle.digest(n[1], enc).then(function (buf) {
          var hex = toHex(buf);
          current[n[1]] = hex;
          html += "<tr><td><b>" + n[0] + "</b></td><td style='font-family:monospace;font-size:0.85rem;word-break:break-all;'>" + hex + "</td></tr>";
        });
      });
      Promise.all(promises).then(function () {
        html += "</table>";
        res.innerHTML = html;
      });
    }
    function compare() {
      var expected = document.getElementById("expected").value.trim().toLowerCase();
      var res = document.getElementById("cmpResult");
      if (!expected) { res.innerHTML = '<p class="hint">照合するハッシュ値を入力してください。</p>'; return; }
      // ハッシュ長からアルゴリズムを自動判定
      var algo = null;
      if (/^[0-9a-f]{32}$/.test(expected)) algo = "md5";
      else if (/^[0-9a-f]{40}$/.test(expected)) algo = "sha-1";
      else if (/^[0-9a-f]{64}$/.test(expected)) algo = "sha-256";
      if (!algo) {
        res.innerHTML = '<p class="hint">16進数のハッシュ値（MD5: 32桁 / SHA-1: 40桁 / SHA-256: 64桁）を入力してください。</p>';
        return;
      }
      if (!current[algo]) { res.innerHTML = '<p class="hint">先に「ハッシュを計算」してください。</p>'; return; }
      var labels = { "md5": "MD5", "sha-1": "SHA-1", "sha-256": "SHA-256" };
      var match = current[algo] === expected;
      res.innerHTML = "<p>" + (match ? "✅ <b>一致します</b>（" + labels[algo] + "）" : "❌ <b>一致しません</b>（" + labels[algo] + "）") + "</p>" +
        "<p class='hint'>入力テキストの" + labels[algo] + ": " + current[algo] + "</p>";
    }
  </script>
</body>
</html>
