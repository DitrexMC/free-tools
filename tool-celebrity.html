    (function init() {
      var m = document.getElementById("m");
      for (var i = 1; i <= 12; i++) m.add(new Option(i + "月", i));
      m.value = new Date().getMonth() + 1;
      var d = document.getElementById("d");
      for (var j = 1; j <= 31; j++) d.add(new Option(j + "日", j));
      d.value = new Date().getDate();
    })();
    function calc() {
      var key = document.getElementById("m").value + "-" + document.getElementById("d").value;
      var list = CELEBS[key];
      var tbl = document.getElementById("tbl");
      if (!list || list.length === 0) {
        tbl.innerHTML = "<tr><td>この日生まれの収録済み有名人はいませんでした。</td></tr>";
        return;
      }
      var html = "<tr><th>名前</th><th>分野</th></tr>";
      list.forEach(function (p) { html += "<tr><td>" + p[0] + "</td><td>" + p[1] + "</td></tr>"; });
      tbl.innerHTML = html;
