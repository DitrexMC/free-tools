<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カメラの被写界深度計算｜FreeTools</title>
  <meta name="description" content="焦点距離・絞り値・被写体距離から被写界深度を無料で計算。ボケ量とパンフォーカス判定が一目でわかります。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 被写界深度計算</div>
    <div class="tool-hero">
      <h1>📷 カメラの被写界深度計算</h1>
      <p class="subtitle" style="margin-bottom:0;">焦点距離・絞りからピントが合う範囲を算出します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>センサーサイズ</label>
      <select id="sensor">
        <option value="0.03">フルサイズ（0.03mm）</option>
        <option value="0.02">APS-C（0.02mm）</option>
        <option value="0.015">マイクロフォーサーズ（0.015mm）</option>
        <option value="0.006">スマホ・1インチ未満（0.006mm）</option>
      </select>
      <label>焦点距離 (mm)</label>
      <input type="number" id="focal" min="1" max="2000" value="50">
      <label>絞り値（F値）</label>
      <input type="number" id="fstop" min="0.5" max="64" step="0.1" value="1.8">
      <label>被写体までの距離 (m)</label>
      <input type="number" id="dist" min="0.1" max="1000" step="0.1" value="3">
      <div class="btn-row">
        <button class="primary" onclick="calc()">被写界深度を計算</button>
      </div>
      <table class="tz-table" id="tbl" style="max-width:560px;"></table>
      <p class="hint">※ 簡易計算式による目安です。正確な値はレンズ特性により前後します。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function calc() {
      var coc = parseFloat(document.getElementById("sensor").value);
      var focal = parseFloat(document.getElementById("focal").value);
      var f = parseFloat(document.getElementById("fstop").value);
      var dist = parseFloat(document.getElementById("dist").value);
      var tbl = document.getElementById("tbl");
      if (!focal || !f || !dist || focal < 1 || f < 0.5 || dist < 0.1) {
        tbl.innerHTML = "<tr><td>値を正しく入力してください。</td></tr>"; return;
      }
      var fc = focal / 1000; // mm→m
      var cocM = coc / 1000; // 許容錯乱円 mm→m
      var hyper = (fc * fc) / (f * cocM); // 過焦点距離 m
      var nf = (hyper * dist) / (hyper + (dist - fc));
      var ff = (hyper * dist) / (hyper - (dist - fc));
      if (ff <= 0 || isNaN(ff)) ff = Infinity; // 無限遠
      var dof = ff === Infinity ? Infinity : ff - nf;
      var rows = "<tr><th>項目</th><th>値</th></tr>" +
        "<tr><td>過焦点距離</td><td>" + hyper.toFixed(2) + " m</td></tr>" +
        "<tr><td>近点</td><td>" + nf.toFixed(2) + " m</td></tr>" +
        "<tr><td>遠点</td><td>" + (ff === Infinity ? "∞（無限遠）" : ff.toFixed(2) + " m") + "</td></tr>" +
        "<tr><td>被写界深度</td><td>" + (dof === Infinity ? "∞" : dof.toFixed(2) + " m") + "</td></tr>" +
        "<tr><td>判定</td><td>" + (dof === Infinity ? "✅ パンフォーカス（全域ピント）" : (dof < 0.3 ? "🔍 浅い（ボケやすい）" : "👍 標準的な深さ")) + "</td></tr>";
      tbl.innerHTML = rows;
    }
    (function () { calc(); })();
  </script>
</body>
</html>
