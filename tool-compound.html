<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>複利計算｜FreeTools</title>
  <meta name="description" content="元本・利率・期間から複利の将来価値を無料で計算。毎月積立も考慮した資産運用シミュレーション。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 複利計算</div>
    <div class="tool-hero">
      <h1>複利計算</h1>
      <p class="subtitle" style="margin-bottom:0;">元本と年利率から、複利運用した場合の将来価値を計算します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>元本（円）</label>
      <input type="number" id="principal" value="1000000" min="0" style="width:auto;" oninput="calc()">
      <label>年利率（％）</label>
      <input type="number" id="rate" value="3" step="0.1" min="0" style="width:auto;" oninput="calc()">
      <label>運用期間（年）</label>
      <input type="number" id="years" value="10" min="1" max="100" style="width:auto;" oninput="calc()">
      <label>毎月の積立額（円・任意）</label>
      <input type="number" id="monthly" value="0" min="0" style="width:auto;" oninput="calc()">
      <div class="btn-row">
        <button onclick="calc()">🧮 計算する</button>
      </div>
      <table class="tz-table" id="tbl" style="max-width:460px;"></table>
      <p class="hint">複利計算は年1回の複利とし、元本と毎月積立（年初払い）を合算します。税・手数料は考慮していません。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function calc() {
      var p = parseFloat(document.getElementById("principal").value) || 0;
      var r = parseFloat(document.getElementById("rate").value) || 0;
      var y = parseInt(document.getElementById("years").value, 10) || 1;
      var m = parseFloat(document.getElementById("monthly").value) || 0;
      var tbl = document.getElementById("tbl");
      if (y < 1) y = 1;
      if (y > 100) y = 100;
      var rate = r / 100;
      var totalDep = p;
      var fv;
      if (m > 0) {
        var annual = m * 12;
        fv = p;
        for (var i = 0; i < y; i++) {
          totalDep += annual;
          fv = (fv + annual) * (1 + rate);
        }
      } else {
        fv = p * Math.pow(1 + rate, y);
      }
      var profit = fv - totalDep;
      var fmt = function(x) { return Math.round(x).toLocaleString() + " 円"; };
      tbl.innerHTML =
        "<tr><th>項目</th><th>金額</th></tr>" +
        "<tr><td>元本</td><td>" + fmt(p) + "</td></tr>" +
        "<tr><td>積立総額（元本含む）</td><td>" + fmt(totalDep) + "</td></tr>" +
        "<tr><td>運用後の将来価値</td><td>" + fmt(fv) + "</td></tr>" +
        "<tr><td>運用益（利息）</td><td>" + fmt(Math.max(profit, 0)) + "</td></tr>" +
        "<tr><td>倍率</td><td>" + (totalDep > 0 ? (fv / totalDep).toFixed(2) + " 倍" : "-") + "</td></tr>";
    }
    calc();
  </script>
</body>
</html>
