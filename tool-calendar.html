<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カレンダー生成｜FreeTools</title>
  <meta name="description" content="月別カレンダーを無料で生成。祝日・曜日・六曜入りの印刷用カレンダーを作成できます。">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .cal-nav { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .cal-title { font-size:1.3em; font-weight:bold; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-top:10px; max-width:640px; }
    .cal-cell { padding:6px 2px; text-align:center; border:1px solid #e5e7eb; font-size:0.9em; }
    .cal-cell.sat { color:#2563eb; }
    .cal-cell.sun, .cal-cell.holiday { color:#dc2626; }
    .cal-cell.today { background:#fef3c7; font-weight:bold; }
    .cal-cell.empty { border:none; }
    .cal-hol { display:inline-block; font-size:0.7em; color:#dc2626; }
    .cal-cell.dow { background:#f3f4f6; font-weight:bold; }
    .cal-day { display:block; }
  </style>
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › カレンダー生成</div>
    <div class="tool-hero">
      <h1>カレンダー生成</h1>
      <p class="subtitle" style="margin-bottom:0;">年と月を選ぶだけで、祝日入りのカレンダーを生成します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <div class="cal-nav">
        <label>年</label>
        <input type="number" id="year" style="width:100px;" value="2026">
        <label>月</label>
        <input type="number" id="month" min="1" max="12" style="width:70px;" value="8">
        <div class="btn-row" style="margin:0;">
          <button onclick="prevMonth()">◀ 前月</button>
          <button onclick="nextMonth()">次月 ▶</button>
          <button onclick="render()">📅 生成</button>
        </div>
      </div>
      <div id="calWrap"></div>
      <p class="hint">日本の国民の祝日を自動反映します。表示は端末のロケールに依存します。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function holidaysFor(y) {
      var m = {};
      function add(mm, dd) { m[(mm < 10 ? "0" : "") + mm + "-" + (dd < 10 ? "0" : "") + dd] = true; }
      add(1,1); add(1,2); add(1,3);
      // 成人の日: 1月の第2月曜
      var d2 = new Date(y,0,1); while(d2.getDay()!==1) d2.setDate(d2.getDate()+1); add(1, d2.getDate()+7);
      add(2,11);
      if(y>=2019){ var g = new Date(y,1,11); while(g.getDay()!==1) g.setDate(g.getDate()+1); add(2,g.getDate()); }
      add(2,23);
      add(3,21); // 春分(近似)
      add(4,29);
      var sh = new Date(y,4,3); while(sh.getDay()!==0) sh.setDate(sh.getDate()+1); if(sh.getDate()<=3) sh.setDate(sh.getDate()+7); add(5,sh.getDate());
      add(5,3); add(5,4); add(5,5);
      if(y>=2016){ var sp = new Date(y,6,18); while(sp.getDay()!==1) sp.setDate(sp.getDate()+1); add(7,sp.getDate()); }
      add(8,11);
      if(y>=2016){ var sk = new Date(y,8,15); while(sk.getDay()!==1) sk.setDate(sk.getDate()+1); add(9,sk.getDate()); }
      add(9,23); // 秋分(近似)
      if(y>=2016){ var tb = new Date(y,9,10); while(tb.getDay()!==1) tb.setDate(tb.getDate()+1); add(10,tb.getDate()); }
      add(11,3);
      if(y>=2016){ var bk = new Date(y,10,16); while(bk.getDay()!==1) bk.setDate(bk.getDate()+1); add(11,bk.getDate()); }
      add(11,23);
      add(12,23);
      return m;
    }
    var HOL;
    function render() {
      var y = parseInt(document.getElementById("year").value,10);
      var mo = parseInt(document.getElementById("month").value,10);
      if (isNaN(y) || y < 1900 || y > 2200) { document.getElementById("calWrap").innerHTML = "<p class='hint'>年は1900〜2200の範囲で入力してください。</p>"; return; }
      if (isNaN(mo) || mo < 1 || mo > 12) { document.getElementById("calWrap").innerHTML = "<p class='hint'>月は1〜12で入力してください。</p>"; return; }
      HOL = holidaysFor(y);
      var first = new Date(y, mo-1, 1);
      var startDow = first.getDay(); // 0=Sun
      var daysInMonth = new Date(y, mo, 0).getDate();
      var today = new Date();
      var todayKey = today.getFullYear() === y && today.getMonth() === mo-1 ? today.getDate() : 0;
      var dowNames = ["日","月","火","水","木","金","土"];
      var html = '<div class="cal-title">' + y + "年 " + mo + "月</div>";
      html += '<div class="cal-grid">';
      for (var d=0; d<7; d++) html += '<div class="cal-cell dow' + (d===0?" sun":(d===6?" sat":"")) + '">' + dowNames[d] + "</div>";
      for (var i=0; i<startDow; i++) html += '<div class="cal-cell empty"></div>';
      for (var day=1; day<=daysInMonth; day++) {
        var mm = (mo<10?"0":"")+mo, dd=(day<10?"0":"")+day;
        var key = mm + "-" + dd;
        var dow = new Date(y, mo-1, day).getDay();
        var cls = "cal-cell" + (dow===0?" sun":(dow===6?" sat":"")) + (HOL[key]?" holiday":"") + (day===todayKey?" today":"");
        var holName = HOL[key] ? "<span class='cal-hol'>祝</span>" : "";
        html += '<div class="' + cls + '"><span class="cal-day">' + day + "</span>" + holName + "</div>";
      }
      html += "</div>";
      document.getElementById("calWrap").innerHTML = html;
    }
    function prevMonth() {
      var mo = parseInt(document.getElementById("month").value,10);
      var y = parseInt(document.getElementById("year").value,10);
      if (mo === 1) { document.getElementById("month").value = 12; document.getElementById("year").value = y - 1; }
      else document.getElementById("month").value = mo - 1;
      render();
    }
    function nextMonth() {
      var mo = parseInt(document.getElementById("month").value,10);
      var y = parseInt(document.getElementById("year").value,10);
      if (mo === 12) { document.getElementById("month").value = 1; document.getElementById("year").value = y + 1; }
      else document.getElementById("month").value = mo + 1;
      render();
    }
    render();
  </script>
</body>
</html>
