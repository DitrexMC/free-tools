<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食塩相当量計算｜FreeTools</title>
  <meta name="description" content="ナトリウム量（mg）から食塩相当量（g）を無料で計算。食品の栄養成分表示から1食分・1日の塩分量の目安をチェックできます。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 食塩相当量計算</div>
    <div class="tool-hero">
      <h1>🧂 食塩相当量計算</h1>
      <p class="subtitle" style="margin-bottom:0;">ナトリウム量から食塩相当量を算出します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>栄養成分表示のナトリウム量（mg / 100g または 1食分）</label>
      <input type="number" id="na" min="0" max="50000" step="1" value="800">
      <label>摂取する分量（g または ml）</label>
      <input type="number" id="amount" min="0" max="5000" step="1" value="100">
      <div class="btn-row">
        <button class="primary" onclick="calc()">計算する</button>
      </div>
      <table class="tz-table" id="tbl" style="max-width:640px;"></table>
      <p class="hint">※ 食塩相当量 = ナトリウム量 × 2.54 ÷ 1000（g）。ナトリウム 1mg ≈ 食塩 2.54mg。日本人の食事摂取基準（2025年版）の食塩目標量は成人男性 7.0g未満、成人女性 6.0g未満/日です。</p>
    </div>

    <div class="card">
      <h2>🥗 食品の塩分目安（100gあたり）</h2>
      <table class="tz-table" id="ref" style="max-width:640px;"></table>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function calc() {
      var tbl = document.getElementById("tbl");
      var na = parseFloat(document.getElementById("na").value);
      var amount = parseFloat(document.getElementById("amount").value);
      if (isNaN(na) || isNaN(amount) || na < 0 || amount <= 0) {
        tbl.innerHTML = "<tr><td>ナトリウム量と分量を正しく入力してください。</td></tr>";
        return;
      }
      var per100g = na * 2.54 / 1000;
      var consumed = per100g * (amount / 100);
      var pct = Math.round(consumed / 7.0 * 100);
      var mark = "";
      if (consumed >= 3.5) mark = "🔴 塩分多め。1食分としてはかなり多い量です。";
      else if (consumed >= 2) mark = "🟡 1食分としてはやや多め。";
      else mark = "🟢 1食分としては妥当な範囲です。";
      var rows = "<tr><th>項目</th><th>値</th></tr>" +
        "<tr><td>入力ナトリウム量</td><td>" + na.toLocaleString() + " mg / 表示単位</td></tr>" +
        "<tr><td>食塩相当量（表示単位あたり）</td><td>" + per100g.toFixed(2) + " g</td></tr>" +
        "<tr><td>摂取分量での食塩量</td><td><b>" + consumed.toFixed(2) + " g</b></td></tr>" +
        "<tr><td>1日の目標量（7g）に対する割合</td><td>約 " + pct + " %</td></tr>" +
        "<tr><td>目安</td><td>" + mark + "</td></tr>";
      tbl.innerHTML = rows;
    }
    function initRef() {
      var items = [
        ["味噌汁（1杯 200ml）", "1.5 g"],
        ["醤油（大さじ1 18ml）", "2.6 g"],
        ["梅干し（1個 20g）", "2.0 g"],
        ["即席ラーメン（1食）", "5〜6 g"],
        ["ハム（100g）", "2.5 g"],
        ["ベーコン（100g）", "2.4 g"],
        ["スナック菓子（100g）", "2.0 g"],
        ["食パン（6枚切り 1枚）", "0.8 g"]
      ];
      var rows = "<tr><th>食品</th><th>食塩相当量</th></tr>";
      for (var i = 0; i < items.length; i++) {
        rows += "<tr><td>" + items[i][0] + "</td><td>" + items[i][1] + "</td></tr>";
      }
      document.getElementById("ref").innerHTML = rows;
    }
    (function () { calc(); initRef(); })();
  </script>
</body>
</html>
