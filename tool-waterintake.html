<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1日の水分摂取量計算｜FreeTools</title>
  <meta name="description" content="体重と運動量から1日に必要な水分摂取量を無料で計算。コップ何杯・500mlペットボトル何本の目安も表示します。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 1日の水分摂取量計算</div>
    <div class="tool-hero">
      <h1>1日の水分摂取量計算</h1>
      <p class="subtitle" style="margin-bottom:0;">体重と運動量から1日の水分摂取量の目安を算出。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>体重（kg）</label>
      <input type="number" id="weight" value="60" min="0" step="0.5" style="width:100%;box-sizing:border-box;max-width:280px;">
      <div style="margin-top:10px;">
        <label>運動量</label>
        <select id="activity" style="width:100%;box-sizing:border-box;max-width:280px;">
          <option value="1" selected>ほとんど運動しない</option>
          <option value="1.2">軽い運動（週1〜3回）</option>
          <option value="1.4">中程度の運動（週3〜5回）</option>
          <option value="1.6">激しい運動（ほぼ毎日）</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="primary" onclick="calc()">計算する</button>
      </div>
      <p class="hint">1日あたり体重1kgにつき約35mlを基準にしています。気温・発汗量で必要な量は変わります。</p>
      <table class="tz-table" id="tbl" style="max-width:520px;"></table>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function calc() {
      var w = parseFloat(document.getElementById("weight").value);
      var act = parseFloat(document.getElementById("activity").value);
      var tbl = document.getElementById("tbl");
      if (isNaN(w) || w <= 0) {
        tbl.innerHTML = "<tr><td style='color:#b71c1c;'>0より大きい体重を入力してください。</td></tr>";
        return;
      }
      var ml = w * 35 * act;
      var cups = ml / 250;       // コップ1杯250ml
      var bottles = ml / 500;    // ペットボトル500ml
      var l = ml / 1000;
      var html =
        "<tr><th>項目</th><th>目安</th></tr>" +
        "<tr><td style='font-weight:bold;'>1日の必要水分量</td><td style='font-weight:bold;color:#1b5e20;'>約 " + Math.round(ml) + " ml（" + l.toFixed(1) + " L）</td></tr>" +
        "<tr><td>コップ（250ml）換算</td><td>約 " + Math.round(cups) + " 杯</td></tr>" +
        "<tr><td>ペットボトル（500ml）換算</td><td>約 " + Math.round(bottles) + " 本</td></tr>" +
        "<tr><td colspan='2' style='background:#f5f5f5;'>食事からも水分は摂れます。飲料として摂る量は、この目安の約半分で大丈夫とされています。</td></tr>";
      tbl.innerHTML = html;
    }
    calc();
  </script>
</body>
</html>
