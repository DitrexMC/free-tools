<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台風の強さ・風力階級計算｜FreeTools</title>
  <meta name="description" content="最大風速から台風の強さ分類（強い・非常に強い・猛烈な）と風力階級（ビューフォート階級）を無料で判定。台風用語の解説付き。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 台風の強さ・風力階級計算</div>
    <div class="tool-hero">
      <h1>🌀 台風の強さ・風力階級計算</h1>
      <p class="subtitle" style="margin-bottom:0;">最大風速から台風の強さと風力階級を判定します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>最大風速（m/s）</label>
      <input type="number" id="ws" min="0" max="120" step="0.1" value="45">
      <div class="btn-row">
        <button class="primary" onclick="calc()">判定する</button>
      </div>
      <table class="tz-table" id="tbl" style="max-width:560px;"></table>
      <p class="hint">※ 気象庁の台風階級は最大風速 33m/s以上を「強い台風」、44m/s以上を「非常に強い台風」、54m/s以上を「猛烈な台風」と分類します。風力階級は国際的なビューフォート風力階級です。</p>
    </div>

    <div class="card">
      <h2>📖 台風用語 早見表</h2>
      <table class="tz-table" id="terms" style="max-width:760px;"></table>
      <p class="hint">※ 進路予報円・暴風警戒域は気象庁が発表する台風情報の用語です。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function windInfo(m) {
      if (m >= 54) return ["猛烈な台風", "🔴", "樹木や電柱が倒れ、移動中の車は横転する恐れ。最大限の警戒を。"];
      if (m >= 44) return ["非常に強い台風", "🟠", "屋根瓦や看板が飛散し、多くの建物に被害が出る。不要不急の外出は厳禁。"];
      if (m >= 33) return ["強い台風", "🟡", "人家が倒壊するような強い風。風で飛ばされる物に注意。"];
      if (m >= 25) return ["台風", "🔵", "歩行者は傘をさせず、転倒する人も出る強風。"];
      if (m >= 17.2) return ["台風", "🔵", "風速17.2m/s以上で台風と定義。強い風に注意。"];
      if (m >= 13.9) return ["熱帯低気圧", "⚪", "強い風速域はないが油断は禁物。"];
      return ["熱帯低気圧", "⚪", "まだ台風ではありません。"];
    }
    function beaufort(m) {
      var tiers = [
        [0.3, 0, "無風", "煙がまっすぐ昇る"],
        [1.6, 1, "至軽風", "煙がなびく程度"],
        [3.4, 2, "軽風", "顔に風を感じる"],
        [5.5, 3, "軟風", "木の葉が揺れる"],
        [8.0, 4, "和風", "砂ぼこりが立つ"],
        [10.8, 5, "疾風", "小枝が揺れる"],
        [13.9, 6, "雄風", "大きな木の枝が揺れる"],
        [17.2, 7, "強風", "木全体が揺れる。傘がさせない"],
        [20.8, 8, "疾強風", "歩行困難になる"],
        [24.5, 9, "大強風", "屋根瓦が飛ぶことがある"],
        [28.5, 10, "暴風", "樹木が倒れることがある"],
        [32.7, 11, "暴風", "広範囲で大きな被害"],
        [999, 12, "猛烈な風", "破壊的な被害。最大級の警戒"]
      ];
      for (var i = 0; i < tiers.length; i++) {
        if (m < tiers[i][0]) return [tiers[i][1], tiers[i][2], tiers[i][3]];
      }
      return [12, "猛烈な風", "破壊的な被害"];
    }
    function calc() {
      var val = document.getElementById("ws").value;
      var tbl = document.getElementById("tbl");
      if (val === "" || isNaN(val) || val < 0 || val > 120) { tbl.innerHTML = "<tr><td>0〜120 m/s の数値を入力してください。</td></tr>"; return; }
      var m = parseFloat(val);
      var w = windInfo(m);
      var b = beaufort(m);
      var rows = "<tr><th>項目</th><th>値</th></tr>" +
        "<tr><td>最大風速</td><td><b>" + m.toFixed(1) + " m/s</b></td></tr>" +
        "<tr><td>台風の強さ</td><td>" + w[1] + " <b>" + w[0] + "</b></td></tr>" +
        "<tr><td>風力階級</td><td>風力 " + b[0] + "（" + b[1] + "）</td></tr>" +
        "<tr><td>陸上の様子</td><td>" + b[2] + "</td></tr>" +
        "<tr><td>警戒点</td><td>" + w[2] + "</td></tr>";
      tbl.innerHTML = rows;
    }
    function initTerms() {
      var terms = [
        ["暴風域", "台風の中心付近で風速25m/s以上の強い風が吹いている範囲。"],
        ["強風域", "風速15m/s以上の風が吹いている範囲。"],
        ["進路予報円", "台風の中心が進むと予想される範囲を円で表したもの（完全にこの円の中を進むとは限らない）。"],
        ["暴風警戒域", "台風の中心が進路予報円内に入った場合に暴風域に入る可能性がある範囲。"],
        ["最大瞬間風速", "観測された瞬間的な最大の風速。平均風速より10m/s前後大きいことが多い。"],
        ["大雨特別警報", "数十年に一度の大雨となる恐れがある場合に発表される最大級の警戒情報。"]
      ];
      var rows = "<tr><th>用語</th><th>意味</th></tr>";
      for (var i = 0; i < terms.length; i++) {
        rows += "<tr><td><b>" + terms[i][0] + "</b></td><td>" + terms[i][1] + "</td></tr>";
      }
      document.getElementById("terms").innerHTML = rows;
    }
    (function () { calc(); initTerms(); })();
  </script>
</body>
</html>
