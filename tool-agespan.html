<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>年齢・期間換算｜FreeTools</title>
  <meta name="description" content="年齢や期間を日数・時間・分・秒に換算する無料ツール。生年月日からの経過時間を計算します。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 年齢・期間換算</div>
    <div class="tool-hero">
      <h1>年齢・期間換算</h1>
      <p class="subtitle" style="margin-bottom:0;">生年月日から、これまでの経過日数・時間・秒を計算します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>生年月日</label>
      <input type="date" id="birth" style="width:auto;">
      <div class="btn-row">
        <button onclick="calc()">🧮 計算する</button>
      </div>
      <table class="tz-table" id="tbl" style="display:none;max-width:360px;"></table>
      <p class="hint">現在時刻は端末の時計を使用します。</p>
    </div>

    <div class="card">
      <label>期間の換算（例: 1年間は何秒？）</label>
      <div class="btn-row" style="align-items:center;">
        <input type="number" id="days" placeholder="日数" style="width:120px;" oninput="conv()">
        <input type="number" id="hours" placeholder="時間" style="width:120px;" oninput="conv()">
        <input type="number" id="minutes" placeholder="分" style="width:120px;" oninput="conv()">
      </div>
      <table class="tz-table" id="convTbl" style="display:none;max-width:360px;"></table>
      <p class="hint">日・時・分を組み合わせて入力すると、秒数や時間に換算します。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function calc() {
      var val = document.getElementById("birth").value;
      var tbl = document.getElementById("tbl");
      if (!val) { tbl.style.display = "none"; return; }
      var birth = new Date(val + "T00:00:00");
      var now = new Date();
      var diffMs = now - birth;
      if (diffMs < 0) { tbl.style.display = "none"; return; }
      var days = Math.floor(diffMs / 86400000);
      var hours = Math.floor(diffMs / 3600000);
      var minutes = Math.floor(diffMs / 60000);
      var seconds = Math.floor(diffMs / 1000);
      var years = now.getFullYear() - birth.getFullYear();
      var m = now.getMonth() - birth.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < birth.getDate())) years--;
      var weeks = Math.floor(days / 7);
      var remDays = days % 7;
      var msAge = now - new Date(birth.getFullYear() + years, birth.getMonth(), birth.getDate());
      var isLeap = birth.getFullYear() % 4 === 0 && (birth.getFullYear() % 100 !== 0 || birth.getFullYear() % 400 === 0);
      var dogYears = (days / 365.25) * 7;
      var catYears = (days / 365.25) * 5.5;
      tbl.style.display = "";
      tbl.innerHTML =
        "<tr><th>項目</th><th>値</th></tr>" +
        "<tr><td>年齢（満年齢）</td><td>" + years + " 歳</td></tr>" +
        "<tr><td>経過日数</td><td>" + days.toLocaleString() + " 日</td></tr>" +
        "<tr><td>週数</td><td>" + weeks.toLocaleString() + " 週 " + remDays + " 日</td></tr>" +
        "<tr><td>経過時間</td><td>" + hours.toLocaleString() + " 時間</td></tr>" +
        "<tr><td>経過分</td><td>" + minutes.toLocaleString() + " 分</td></tr>" +
        "<tr><td>経過秒</td><td>" + seconds.toLocaleString() + " 秒</td></tr>" +
        "<tr><td>うるう年生まれ</td><td>" + (isLeap ? "はい（2月29日）" : "いいえ") + "</td></tr>" +
        "<tr><td>犬年齢換算（約7倍）</td><td>約 " + dogYears.toFixed(1) + " 歳</td></tr>" +
        "<tr><td>猫年齢換算（約5.5倍）</td><td>約 " + catYears.toFixed(1) + " 歳</td></tr>";
    }
    function conv() {
      var d = parseFloat(document.getElementById("days").value) || 0;
      var h = parseFloat(document.getElementById("hours").value) || 0;
      var m = parseFloat(document.getElementById("minutes").value) || 0;
      var tbl = document.getElementById("convTbl");
      if (d === 0 && h === 0 && m === 0) { tbl.style.display = "none"; return; }
      var totalMinutes = d * 1440 + h * 60 + m;
      var totalHours = d * 24 + h + m / 60;
      var totalSeconds = totalMinutes * 60;
      tbl.style.display = "";
      tbl.innerHTML =
        "<tr><th>項目</th><th>値</th></tr>" +
        "<tr><td>合計時間</td><td>" + totalHours.toLocaleString() + " 時間</td></tr>" +
        "<tr><td>合計分</td><td>" + totalMinutes.toLocaleString() + " 分</td></tr>" +
        "<tr><td>合計秒</td><td>" + totalSeconds.toLocaleString() + " 秒</td></tr>";
    }
  </script>
</body>
</html>
