<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字幅・バイト数計算｜FreeTools</title>
  <meta name="description" content="文字列の表示幅（全角・半角）やバイト数・文字数を計算する無料ツール。SNSの文字数制限対策に。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 文字幅・バイト数計算</div>
    <div class="tool-hero">
      <h1>文字幅・バイト数計算</h1>
      <p class="subtitle" style="margin-bottom:0;">文字列の全角/半角表示幅・バイト数・文字数を瞬時に計算します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>テキストを入力</label>
      <textarea id="input" rows="5" style="width:100%;" oninput="calc()" placeholder="文字列を入力…"></textarea>
      <table class="tz-table" style="max-width:360px;">
        <tr><td>文字数</td><td id="rCount">0</td></tr>
        <tr><td>表示幅（全角2・半角1）</td><td id="rWidth">0</td></tr>
        <tr><td>UTF-8バイト数</td><td id="rBytes">0</td></tr>
        <tr><td>Shift_JISバイト数</td><td id="rSjis">0</td></tr>
        <tr><td>全角文字数</td><td id="rZen">0</td></tr>
        <tr><td>半角文字数</td><td id="rHan">0</td></tr>
        <tr><td>改行数</td><td id="rNewline">0</td></tr>
      </table>
      <p class="hint">Twitter/X: 280文字 / 旧140文字 などの目安にもどうぞ。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function isWideChar(ch) {
      var code = ch.codePointAt(0);
      // CJK, fullwidth forms, kana, hangul, emoji ranges
      if (code >= 0x1100 && code <= 0x115F) return true; // Hangul Jamo
      if (code >= 0x2E80 && code <= 0xA4CF) return true; // CJK Radicals..Yi
      if (code >= 0xAC00 && code <= 0xD7A3) return true; // Hangul
      if (code >= 0xF900 && code <= 0xFAFF) return true; // CJK compat
      if (code >= 0xFE30 && code <= 0xFE4F) return true; // CJK compat forms
      if (code >= 0xFF00 && code <= 0xFF60) return true; // Fullwidth forms
      if (code >= 0xFFE0 && code <= 0xFFE6) return true;
      if (code >= 0x1F300 && code <= 0x1FAFF) return true; // emoji
      if (code >= 0x20000 && code <= 0x3FFFD) return true; // CJK ext
      return false;
    }
    function utf8Bytes(str) {
      return new TextEncoder().encode(str).length;
    }
    function sjisBytes(str) {
      var total = 0;
      for (var i = 0; i < str.length; i++) {
        var code = str.charCodeAt(i);
        if (code <= 0x7F) total += 1;             // ASCII
        else if (code >= 0xFF61 && code <= 0xFF9F) total += 1; // halfwidth kana (approx)
        else total += 2;                            // fullwidth
      }
      return total;
    }
    function calc() {
      var text = document.getElementById("input").value;
      var width = 0, zen = 0, han = 0, newlines = 0, count = 0;
      for (var i = 0; i < text.length;) {
        var code = text.codePointAt(i);
        var ch = String.fromCodePoint(code);
        var isSurrogate = code > 0xFFFF;
        if (ch === "\n") { newlines++; width += 1; }
        else if (isWideChar(ch)) { width += 2; zen++; }
        else { width += 1; han++; }
        count++;
        i += isSurrogate ? 2 : 1;
      }
      document.getElementById("rCount").innerText = count;
      document.getElementById("rWidth").innerText = width;
      document.getElementById("rBytes").innerText = utf8Bytes(text).toLocaleString();
      document.getElementById("rSjis").innerText = sjisBytes(text).toLocaleString();
      document.getElementById("rZen").innerText = zen;
      document.getElementById("rHan").innerText = han;
      document.getElementById("rNewline").innerText = newlines;
    }
  </script>
</body>
</html>
