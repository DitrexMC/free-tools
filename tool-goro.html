<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>語呂合わせ｜FreeTools</title>
  <meta name="description" content="数字を語呂合わせに変換する無料ツール。誕生日や記念日、パスワードの覚え方に最適。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 語呂合わせ</div>
    <div class="tool-hero">
      <h1>🎵 語呂合わせ</h1>
      <p class="subtitle" style="margin-bottom:0;">数字の並びを語呂合わせに変換します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>数字を入力（例: 4649）</label>
      <input type="text" id="input" placeholder="例: 4649" oninput="convert()">
      <div id="result" style="margin-top:14px;"></div>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    var GORO = {
      "0": ["お", "れい", "まる"], "1": ["い", "ひと", "ひ"], "2": ["に", "ふ", "じ"],
      "3": ["さん", "み", "さ"], "4": ["よ", "し", "よん"], "5": ["ご", "いつ", "こ"],
      "6": ["ろ", "む", "ろく"], "7": ["な", "しち", "なな"], "8": ["は", "や", "ぱ"],
      "9": ["く", "きゅう", "きゅ"]
    };
    var WORDS = {
      "4649": "よろしく", "39": "さんきゅう", "100": "ひゃく", "5963": "ごくろう",
      "885": "はやおき", "517": "いこう", "810": "はやく", "2000": "にせん",
      "1104": "いいおん", "118": "いいな", "1122": "いいふうふ", "108": "とうばん",
      "18782": "いやなやつ", "6000": "むざい", "0804": "おばし", "4751": "しなごと",
      "3341": "さみしい", "0833": "おやさま", "931": "くさい"
    };
    function convert() {
      var s = document.getElementById("input").value.replace(/[^0-9]/g, "");
      var html = "";
      if (WORDS[s]) {
        html += '<div style="font-size:2rem;font-weight:800;margin-bottom:8px;">「' + WORDS[s] + '」</div>';
      }
      var parts = s.split("");
      var kana = parts.map(function (d) { return GORO[d] ? GORO[d][0] : "?"; }).join("");
      if (kana) {
        html += "<p>読み方（代表）: <b>" + kana + "</b></p>";
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;">';
        parts.forEach(function (d) {
          if (!GORO[d]) return;
          html += "<span style=\"display:inline-block;background:#f0f0f0;border-radius:8px;padding:4px 10px;\">" + d + ": " + GORO[d].join("・") + "</span>";
        });
        html += "</div>";
      }
      document.getElementById("result").innerHTML = html || '<p class="hint">数字を入力してください。</p>';
    }
    convert();
  </script>
</body>
</html>
