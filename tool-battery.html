<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バッテリー充電時間計算｜FreeTools</title>
  <meta name="description" content="バッテリー容量と充電器の出力から、フル充電までの時間を無料で計算。効率ロス込みの目安時間を表示します。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › バッテリー充電時間計算</div>
    <div class="tool-hero">
      <h1>バッテリー充電時間計算</h1>
      <p class="subtitle" style="margin-bottom:0;">容量と出力から充電時間を概算。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>バッテリー容量（mAh）</label>
      <input type="number" id="mah" value="5000" min="100" step="100" style="width:100%;box-sizing:border-box;max-width:220px;">
      <div style="margin-top:10px;">
        <label>充電器の出力（W）</label>
        <input type="number" id="watt" value="18" min="1" step="1" style="width:100%;box-sizing:border-box;max-width:220px;">
      </div>
      <div style="margin-top:10px;">
        <label>バッテリー電圧（V）※スマホ・モバイルバッテリーは約3.7V</label>
        <input type="number" id="volt" value="3.7" min="1" step="0.1" style="width:100%;box-sizing:border-box;max-width:220px;">
      </div>
      <div class="btn-row">
        <button class="primary" onclick="calc()">充電時間を計算</button>
      </div>
      <table class="tz-table" id="tbl" style="max-width:560px;"></table>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function calc() {
      var mah = parseFloat(document.getElementById("mah").value);
      var watt = parseFloat(document.getElementById("watt").value);
      var volt = parseFloat(document.getElementById("volt").value);
      var tbl = document.getElementById("tbl");
      if (isNaN(mah) || isNaN(watt) || isNaN(volt) || mah <= 0 || watt <= 0 || volt <= 0) {
        tbl.innerHTML = "<tr><td style='color:#b71c1c;'>正しい数値を入力してください。</td></tr>";
        return;
      }
      // Energy Wh = mAh * V / 1000 ; time h = Wh / W ; efficiency ~85%
      var wh = mah * volt / 1000;
      var ideal = wh / watt;
      var real = ideal / 0.85;
      function fmt(h) {
        var hr = Math.floor(h);
        var min = Math.round((h - hr) * 60);
        if (min >= 60) { hr++; min -= 60; }
        if (hr > 0) return hr + "時間" + (min > 0 ? min + "分" : "");
        return min + "分";
      }
      var rows = "<tr><th>項目</th><th>値</th></tr>" +
        "<tr><td>バッテリー容量</td><td>" + mah.toLocaleString() + " mAh（約 " + wh.toFixed(1) + " Wh）</td></tr>" +
        "<tr><td>充電器の出力</td><td>" + watt + " W</td></tr>" +
        "<tr><td>理論上の充電時間</td><td>約 " + fmt(ideal) + "</td></tr>" +
        "<tr><td>実効充電時間（ロス込み）</td><td>約 " + fmt(real) + "</td></tr>" +
        "<tr><td colspan='2' style='background:#f5f5f5;'>急速充電はバッテリーへの負担が大きくなります。50〜80%までの部分充電が長持ちのコツです。</td></tr>";
      tbl.innerHTML = rows;
    }
    calc();
  </script>
</body>
</html>
