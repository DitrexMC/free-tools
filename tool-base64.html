<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64変換｜FreeTools</title>
  <meta name="description" content="テキストのBase64エンコード・デコードをブラウザ上で無料実行。開発時のデータ変換やメール・トークンの確認に便利です。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › Base64変換</div>
    <div class="tool-hero">
      <h1>🔐 Base64変換</h1>
      <p class="subtitle" style="margin-bottom:0;">テキストとBase64を双方向に変換します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label for="input">入力テキスト</label>
      <textarea id="input" placeholder="変換したいテキストまたはBase64を入力…"></textarea>
      <div class="btn-row">
        <button onclick="doEncode()">エンコード</button>
        <button onclick="doDecode()">デコード</button>
        <button class="secondary" onclick="document.getElementById('input').value='';document.getElementById('output').textContent='';">クリア</button>
      </div>
      <label for="output">変換結果</label>
      <textarea id="output" readonly placeholder="変換結果がここに表示されます"></textarea>
      <div class="btn-row">
        <button class="secondary" onclick="copyText('output')">結果をコピー</button>
      </div>
      <p class="hint" id="err" style="color:#dc2626;"></p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    var err = document.getElementById("err");
    function setErr(m) { err.textContent = m || ""; }
    function doEncode() {
      var value = document.getElementById("input").value;
      try {
        var bytes = new TextEncoder().encode(value);
        var bin = "";
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        document.getElementById("output").value = btoa(bin);
        setErr("");
      } catch (e) { setErr("エンコードに失敗しました: " + e.message); }
    }
    function doDecode() {
      var value = document.getElementById("input").value.trim();
      try {
        var bin = atob(value);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        document.getElementById("output").value = new TextDecoder().decode(bytes);
        setErr("");
      } catch (e) { setErr("デコードに失敗しました。正しいBase64文字列を入力してください。"); }
    }
  </script>
</body>
</html>
