<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家計の予算配分計算｜FreeTools</title>
  <meta name="description" content="毎月の収入を50/30/20ルールで無料で配分。必要な支出・自由に使うお金・貯金の目安額を計算します。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 家計の予算配分計算</div>
    <div class="tool-hero">
      <h1>家計の予算配分計算</h1>
      <p class="subtitle" style="margin-bottom:0;">50/30/20ルールで家計を管理。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>手取り月収（円）</label>
      <input type="number" id="income" value="250000" min="0" step="1000" style="width:100%;box-sizing:border-box;max-width:240px;">
      <div class="btn-row">
        <button class="primary" onclick="calc()">予算を配分</button>
      </div>
      <p class="hint">50/30/20ルール：必要費50％・自由費30％・貯金20％。</p>
      <table class="tz-table" id="tbl" style="max-width:560px;"></table>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function fmt(n) { return Math.round(n).toLocaleString() + "円"; }
    function calc() {
      var inc = parseFloat(document.getElementById("income").value);
      var tbl = document.getElementById("tbl");
      if (isNaN(inc) || inc < 0) {
        tbl.innerHTML = "<tr><td style='color:#b71c1c;'>正しい数値を入力してください。</td></tr>";
        return;
      }
      var need = inc * 0.5;
      var want = inc * 0.3;
      var save = inc * 0.2;
      var rows = "<tr><th>項目</th><th>金額</th><th>割合</th></tr>" +
        "<tr><td>必要な支出（家賃・食費・光熱費など）</td><td>" + fmt(need) + "</td><td>50%</td></tr>" +
        "<tr><td>自由に使うお金（趣味・外食など）</td><td>" + fmt(want) + "</td><td>30%</td></tr>" +
        "<tr><td>貯金・投資</td><td>" + fmt(save) + "</td><td>20%</td></tr>" +
        "<tr><td style='background:#f5f5f5;'>手取り月収</td><td style='background:#f5f5f5;'>" + fmt(inc) + "</td><td style='background:#f5f5f5;'>100%</td></tr>" +
        "<tr><td colspan='3' style='background:#f5f5f5;'>1年間の貯金目安：約 " + fmt(save * 12) + "（ボーナスなしの場合）</td></tr>";
      tbl.innerHTML = rows;
    }
    calc();
  </script>
</body>
</html>
