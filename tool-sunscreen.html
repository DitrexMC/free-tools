<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日焼け止めの必要量計算｜FreeTools</title>
  <meta name="description" content="塗る部位と肌の露出面積から、日焼け止めの必要な量を無料で計算。顔・腕・脚など部位別の目安も表示します。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 日焼け止めの必要量計算</div>
    <div class="tool-hero">
      <h1>日焼け止めの必要量計算</h1>
      <p class="subtitle" style="margin-bottom:0;">部位別の塗る目安量を算出。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>塗る部位（複数選択）</label>
      <div style="margin-top:5px;">
        <label><input type="checkbox" id="face" checked> 顔・首（推奨約2mg/cm²・約1g）</label>
      </div>
      <div>
        <label><input type="checkbox" id="arm"> 腕（両腕）</label>
      </div>
      <div>
        <label><input type="checkbox" id="leg"> 脚（両脚）</label>
      </div>
      <div>
        <label><input type="checkbox" id="body"> 体（背中・お腹）</label>
      </div>
      <div class="btn-row">
        <button class="primary" onclick="calc()">必要量を計算</button>
      </div>
      <p class="hint">標準的な塗り方（2mg/cm²）で換算しています。</p>
      <table class="tz-table" id="tbl" style="max-width:560px;"></table>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    // 部位ごとの概算面積（cm²）
    var AREA = { face: 600, arm: 1200, leg: 2400, body: 4000 };
    function calc() {
      var sel = { face: document.getElementById("face").checked, arm: document.getElementById("arm").checked, leg: document.getElementById("leg").checked, body: document.getElementById("body").checked };
      var names = { face: "顔・首", arm: "両腕", leg: "両脚", body: "体（背中・お腹）" };
      var tbl = document.getElementById("tbl");
      var any = sel.face || sel.arm || sel.leg || sel.body;
      if (!any) { tbl.innerHTML = "<tr><td style='color:#b71c1c;'>少なくとも1つの部位を選択してください。</td></tr>"; return; }
      var totalArea = 0;
      var rows = "<tr><th>部位</th><th>概算面積</th><th>必要量</th></tr>";
      var order = ["face", "arm", "leg", "body"];
      for (var i = 0; i < order.length; i++) {
        var k = order[i];
        if (!sel[k]) continue;
        var a = AREA[k];
        var mg = a * 2;
        totalArea += a;
        rows += "<tr><td>" + names[k] + "</td><td>約 " + a + " cm²</td><td>約 " + (mg / 1000).toFixed(1) + " g</td></tr>";
      }
      rows += "<tr><td style='background:#f5f5f5;'>合計</td><td style='background:#f5f5f5;'>約 " + totalArea + " cm²</td><td style='background:#f5f5f5;'>約 " + (totalArea * 2 / 1000).toFixed(1) + " g</td></tr>";
      rows += "<tr><td colspan='3' style='background:#f5f5f5;'>日焼け止め1本（50g）の目安：約 " + Math.max(1, Math.floor(50 / (totalArea * 2 / 1000))) + "回分。2〜3時間ごとに塗り直しましょう。</td></tr>";
      tbl.innerHTML = rows;
    }
    calc();
  </script>
</body>
</html>
