<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テキスト読み上げ｜FreeTools</title>
  <meta name="description" content="入力したテキストをブラウザの音声合成機能で読み上げる無料ツール。速度や声も調整可能。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › テキスト読み上げ</div>
    <div class="tool-hero">
      <h1>🗣️ テキスト読み上げ</h1>
      <p class="subtitle" style="margin-bottom:0;">ブラウザの音声合成（Web Speech API）でテキストを読み上げます。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <textarea id="text" rows="5" placeholder="こんにちは。これはテストです。"></textarea>
      <div class="calc-row">
        <div>
          <label>声</label>
          <select id="voice"></select>
        </div>
        <div>
          <label>速度</label>
          <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
          <span id="rateVal">1.0x</span>
        </div>
        <div>
          <label>ピッチ</label>
          <input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
        </div>
      </div>
      <div class="btn-row">
        <button onclick="speak()">🔊 読み上げる</button>
        <button class="secondary" onclick="stop()">⏹ 停止</button>
      </div>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    var voices = [];
    function loadVoices() {
      voices = window.speechSynthesis.getVoices();
      var sel = document.getElementById("voice");
      var cur = sel.value;
      sel.innerHTML = "";
      voices.forEach(function (v, i) { sel.add(new Option(v.name + " (" + v.lang + ")", i)); });
      if (cur) sel.value = cur;
    }
    function speak() {
      var text = document.getElementById("text").value;
      if (!text) { alert("テキストを入力してください。"); return; }
      if (!("speechSynthesis" in window)) { alert("このブラウザは読み上げに対応していません。"); return; }
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var idx = parseInt(document.getElementById("voice").value, 10);
      if (!isNaN(idx) && voices[idx]) u.voice = voices[idx];
      u.rate = parseFloat(document.getElementById("rate").value);
      u.pitch = parseFloat(document.getElementById("pitch").value);
      u.lang = "ja-JP";
      window.speechSynthesis.speak(u);
    }
    function stop() { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); }
    document.addEventListener("DOMContentLoaded", function () {
      loadVoices();
      if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = loadVoices;
      var rate = document.getElementById("rate");
      rate.addEventListener("input", function () { document.getElementById("rateVal").textContent = rate.value + "x"; });
    });
  </script>
</body>
</html>
