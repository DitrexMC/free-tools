<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>誕生石カレンダー｜FreeTools</title>
  <meta name="description" content="月ごとの誕生石・石言葉を調べられる無料ツール。プレゼント選びに便利。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 誕生石カレンダー</div>
    <div class="tool-hero">
      <h1>誕生石カレンダー</h1>
      <p class="subtitle" style="margin-bottom:0;">月ごとの誕生石と石言葉を一覧表示します。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <label>誕生月</label>
      <div class="btn-row">
        <button onclick="selectMonth(1)">1月</button><button onclick="selectMonth(2)">2月</button><button onclick="selectMonth(3)">3月</button><button onclick="selectMonth(4)">4月</button><button onclick="selectMonth(5)">5月</button><button onclick="selectMonth(6)">6月</button>
      </div>
      <div class="btn-row">
        <button onclick="selectMonth(7)">7月</button><button onclick="selectMonth(8)">8月</button><button onclick="selectMonth(9)">9月</button><button onclick="selectMonth(10)">10月</button><button onclick="selectMonth(11)">11月</button><button onclick="selectMonth(12)">12月</button>
      </div>
      <div id="result" style="margin-top:12px;"></div>
      <hr style="margin:20px 0;border:none;border-top:1px solid #eee;">
      <label>全月一覧</label>
      <table class="tz-table" id="all"></table>
      <p class="hint">誕生石の定義は国・文化によって異なります。こちらは一般的な和名表記です。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    var stones = [
      { m: 1, name: "ガーネット", word: "真実・友情・忠実" },
      { m: 2, name: "アメシスト", word: "誠実・心の平和" },
      { m: 3, name: "アクアマリン", word: "勇気・聡明" },
      { m: 4, name: "ダイヤモンド", word: "永遠の愛・無垢" },
      { m: 5, name: "エメラルド", word: "幸福・幸運" },
      { m: 6, name: "パール（真珠）", word: "健康・長寿・富" },
      { m: 7, name: "ルビー", word: "情熱・仁愛・威厳" },
      { m: 8, name: "ペリドット", word: "和合・夫婦の幸福" },
      { m: 9, name: "サファイア", word: "慈愛・誠実・徳望" },
      { m: 10, name: "オパール", word: "希望・無邪気" },
      { m: 11, name: "トパーズ", word: "友情・希望・潔白" },
      { m: 12, name: "ターコイズ", word: "成功・勝利" }
    ];
    function selectMonth(m) {
      var s = stones[m - 1];
      var html = '<div style="font-size:1.4rem;">' + m + "月の誕生石</div>";
      html += '<div style="font-size:2rem;font-weight:bold;margin:8px 0;">💎 ' + s.name + "</div>";
      html += '<p>石言葉: <b>' + s.word + "</b></p>";
      document.getElementById("result").innerHTML = html;
    }
    var allHtml = "<tr><th>月</th><th>誕生石</th><th>石言葉</th></tr>";
    stones.forEach(function (s) { allHtml += "<tr><td>" + s.m + "月</td><td>💎 " + s.name + "</td><td>" + s.word + "</td></tr>"; });
    document.getElementById("all").innerHTML = allHtml;
    var now = new Date();
    selectMonth(now.getMonth() + 1);
  </script>
</body>
</html>
