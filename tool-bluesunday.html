<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月曜ブルー度診断｜FreeTools</title>
  <meta name="description" content="月曜日の憂鬱度（月曜ブルー）を無料で診断。7つの質問に答えるだけで自分の月曜ブルー度が分かります。おすすめの対策も表示。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › 月曜ブルー度診断</div>
    <div class="tool-hero">
      <h1>😩 月曜ブルー度診断</h1>
      <p class="subtitle" style="margin-bottom:0;">7つの質問で「月曜ブルー」の度合いをチェックします。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <div id="quiz"></div>
      <div class="btn-row">
        <button class="primary" onclick="result()">診断する</button>
      </div>
      <table class="tz-table" id="tbl" style="max-width:640px;"></table>
      <p class="hint">※ 診断はあくまで目安です。深刻な不調を感じる場合は、無理をせず休息をとったり専門機関に相談してください。</p>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    var QUESTIONS = [
      ["日曜日の夜、明日が来ることに対してどう感じますか？", ["明日が来なければいいのに（3）", "どちらかと言うと憂鬱（2）", "まあ普通（1）", "楽しみ（0）"]],
      ["月曜の朝、目覚ましが鳴ったときの気持ちは？", ["布団から出たくない（3）", "あと5分だけ…（2）", "いつもより少し眠い（1）", "すっきり起きられる（0）"]],
      ["月曜の朝食はどうですか？", ["食欲がない（3）", "あまり食べられない（2）", "いつも通り食べる（1）", "しっかり食べられる（0）"]],
      ["月曜の通勤・通学中、どんな気分ですか？", ["気分が重くてたまらない（3）", "なんとなく気が重い（2）", "ぼんやりしている（1）", "気持ちを切り替えられる（0）"]],
      ["月曜の午前中の集中力は？", ["まったく集中できない（3）", "なかなかエンジンがかからない（2）", "徐々に集中できる（1）", "いつも通り集中できる（0）"]],
      ["今週の予定に楽しみなことはありますか？", ["何も思い浮かばない（3）", "あまりない（2）", "少しはある（1）", "たくさんある（0）"]],
      ["月曜が憂鬱になる原因になりそうなものは？", ["仕事量・課題の多さ（1）", "人間関係（1）", "休み明けの生活リズム（1）", "特にない（0）"]]
    ];
    function initQuiz() {
      var q = document.getElementById("quiz");
      var html = "";
      for (var i = 0; i < QUESTIONS.length; i++) {
        html += "<div class='q-block' style='margin-bottom:14px;'>";
        html += "<label>" + (i + 1) + ". " + QUESTIONS[i][0] + "</label>";
        for (var j = 0; j < QUESTIONS[i][1].length; j++) {
          var score = parseInt(QUESTIONS[i][1][j].match(/（(\d+)）/)[1], 10);
          var label = QUESTIONS[i][1][j].replace(/（\d+）/, "");
          html += "<label style='font-weight:normal;display:block;margin:2px 0;'><input type='radio' name='q" + i + "' value='" + score + "'" + (j === 0 ? " checked" : "") + "> " + label + "</label>";
        }
        html += "</div>";
      }
      q.innerHTML = html;
    }
    function result() {
      var total = 0;
      var max = 0;
      for (var i = 0; i < QUESTIONS.length; i++) {
        var score = parseInt(document.querySelector("input[name='q" + i + "']:checked").value, 10);
        total += score;
        max += 3;
      }
      var pct = Math.round(total / max * 100);
      var tier, color, advice;
      if (pct >= 70) {
        tier = "かなり高い（重度ブルー）"; color = "🔴";
        advice = "月曜がつらくて仕方がない状態です。睡眠リズムの見直しや、週の初めの予定を軽めにするなど、生活にゆとりを作りましょう。長く続く場合は休息や相談も検討を。";
      } else if (pct >= 45) {
        tier = "中程度"; color = "🟠";
        advice = "月曜は少し憂鬱になりがちなタイプです。日曜の夜は早めに就寝し、月曜の朝は好きな音楽や朝食で気分を上げる工夫をするとスムーズです。";
      } else if (pct >= 20) {
        tier = "やや低め"; color = "🟡";
        advice = "月曜ブルーはほとんどありませんが、疲れがたまると憂鬱になることも。週末はリフレッシュを意識しましょう。";
      } else {
        tier = "低い（ブルー無し）"; color = "🟢";
        advice = "月曜ブルーはほぼ無し。仕事や学校への意欲が高い状態です。その調子を維持しましょう。";
      }
      var rows = "<tr><th>項目</th><th>結果</th></tr>" +
        "<tr><td>スコア</td><td>" + total + " / " + max + "（" + pct + "%）</td></tr>" +
        "<tr><td>月曜ブルー度</td><td>" + color + " <b>" + tier + "</b></td></tr>" +
        "<tr><td>アドバイス</td><td>" + advice + "</td></tr>";
      document.getElementById("tbl").innerHTML = rows;
    }
    (function () { initQuiz(); })();
  </script>
</body>
</html>
