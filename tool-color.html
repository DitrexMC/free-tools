<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カラーコード変換｜FreeTools</title>
  <meta name="description" content="HEX・RGB・HSL形式のカラーコードを相互変換する無料ツール。カラーピッカー付き。">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top" id="site-header"></header>
  <main>
    <div class="breadcrumb"><a href="index.html">Home</a> › カラーコード変換</div>
    <div class="tool-hero">
      <h1>🎨 カラーコード変換</h1>
      <p class="subtitle" style="margin-bottom:0;">HEX・RGB・HSL形式を相互変換できます。</p>
    </div>

    <div class="ad-slot" id="ad-top"></div>

    <div class="card">
      <div class="calc-row">
        <div>
          <label>カラーピッカー</label>
          <input type="color" id="picker" value="#3498db" oninput="fromPicker(this.value)">
        </div>
        <div>
          <label>HEX</label>
          <input type="text" id="hex" value="#3498db" placeholder="#RRGGBB">
        </div>
        <div>
          <label>RGB</label>
          <input type="text" id="rgb" value="rgb(52, 152, 219)" placeholder="rgb(r, g, b)">
        </div>
        <div>
          <label>HSL</label>
          <input type="text" id="hsl" value="hsl(204, 70%, 53%)" placeholder="hsl(h, s%, l%)">
        </div>
      </div>
      <div class="result" id="swatch" style="height:70px;border-radius:8px;background:#3498db;"></div>
      <div class="btn-row" style="margin-top:12px;">
        <button onclick="applyHex()">HEXから変換</button>
        <button class="secondary" onclick="applyRgb()">RGBから変換</button>
        <button class="secondary" onclick="applyHsl()">HSLから変換</button>
      </div>
    </div>

    <div class="ad-slot" id="ad-bottom"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    function hexToRgb(hex) {
      var m = /^#?([0-9a-f]{6})$/i.exec(hex.trim());
      if (!m) return null;
      var n = parseInt(m[1], 16);
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }
    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      var max = Math.max(r, g, b), min = Math.min(r, g, b);
      var h = 0, s = 0, l = (max + min) / 2;
      if (max !== min) {
        var d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
      }
      return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
    }
    function hslToRgb(h, s, l) {
      h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
      var c = (1 - Math.abs(2 * l - 1)) * s;
      var x = c * (1 - Math.abs((h / 60) % 2 - 1));
      var m = l - c / 2;
      var r = 0, g = 0, b = 0;
      if (h < 60) { r = c; g = x; }
      else if (h < 120) { r = x; g = c; }
      else if (h < 180) { g = c; b = x; }
      else if (h < 240) { g = x; b = c; }
      else if (h < 300) { r = x; b = c; }
      else { r = c; b = x; }
      return { r: Math.round((r + m) * 255), g: Math.round((g + m) * 255), b: Math.round((b + m) * 255) };
    }
    function render(rgb) {
      var hex = "#" + ((1 << 24) | (rgb.r << 16) | (rgb.g << 8) | rgb.b).toString(16).slice(1);
      var hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
      document.getElementById("hex").value = hex;
      document.getElementById("rgb").value = "rgb(" + rgb.r + ", " + rgb.g + ", " + rgb.b + ")";
      document.getElementById("hsl").value = "hsl(" + hsl.h + ", " + hsl.s + "%, " + hsl.l + "%)";
      document.getElementById("picker").value = hex;
      document.getElementById("swatch").style.background = hex;
    }
    function fromPicker(v) { var rgb = hexToRgb(v); if (rgb) render(rgb); }
    function applyHex() { var rgb = hexToRgb(document.getElementById("hex").value); if (rgb) render(rgb); }
    function applyRgb() {
      var m = /rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(document.getElementById("rgb").value.trim());
      if (!m) { alert("RGB形式が正しくありません"); return; }
      render({ r: +m[1], g: +m[2], b: +m[3] });
    }
    function applyHsl() {
      var m = /hsla?\(\s*(\d+)\s*,\s*(\d+)%?\s*,\s*(\d+)%?\s*\)/.exec(document.getElementById("hsl").value.trim());
      if (!m) { alert("HSL形式が正しくありません"); return; }
      render(hslToRgb(+m[1], +m[2], +m[3]));
    }
  </script>
</body>
</html>
